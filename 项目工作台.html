function persistAndRender() { save(); render(); }
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.dataset.on = 1;
  t.dataset.undo = 0;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.dataset.on = 0; t.dataset.undo = 0; }, 1900);
}
/* 删掉东西之后 6 秒内能撤回：删除是真的会丢数据，只靠一次 confirm 不够 */
function toastUndo(msg, fn) {
  var t = document.getElementById('toast');
  t.textContent = '';
  var sp = document.createElement('span');
  sp.textContent = msg;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'undo';
  btn.textContent = '撤销';
  btn.addEventListener('click', function () {
    t.dataset.on = 0; t.dataset.undo = 0; t.textContent = '';
    fn();
  });
  t.appendChild(sp);
  t.appendChild(btn);
  t.dataset.on = 1;
  t.dataset.undo = 1;
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.dataset.on = 0; t.dataset.undo = 0; }, 6000);
}

function openModal(html) {
  var root = document.getElementById('modalRoot');
  var old = root.querySelector('.modal-mask');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var box = document.createElement('div');
  box.innerHTML = '<div class="modal-mask" data-act="mask"><div class="modal" tabindex="-1" role="dialog" aria-modal="true">' + html + '</div></div>';
  root.appendChild(box.firstChild);
  /* 弹窗打开把焦点放进去，Esc / Tab 才有处可去 */
  var box2 = root.querySelector('.modal');
  if (box2) { try { box2.focus({ preventScroll: true }); } catch (e) { box2.focus(); } }
}
function closeModal() {
  pendingInboxId = null;
  var root = document.getElementById('modalRoot');
  var m = root.querySelector('.modal-mask');
  if (m && m.parentNode) m.parentNode.removeChild(m);
  /* 只摘掉弹窗，抽屉开着就留着并跟着刷新 */
  if (!root.querySelector('.drawer')) root.innerHTML = '';
  else { var dc = root.querySelector('.d-close'); if (dc) { try { dc.focus({ preventScroll: true }); } catch (e) {} } }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.dataset.act;
  var id = t.dataset.id;
  var p = id ? find(id) : null;

  switch (act) {
    case 'open': openDrawer(id); return;
    case 'close-drawer': closeDrawer(); return;
    case 'new': openModal(projectForm(null)); return;
    case 'edit': if (p) openModal(projectForm(p)); return;
    case 'settings': openModal(settingsForm()); return;
    case 'toggle-delivered':
      ui.showDelivered = !ui.showDelivered; renderListOnly();
      var abtn = document.querySelector('.archbtn'); if (abtn) { try { abtn.focus({ preventScroll: true }); } catch (e2) {} }
      return;
    case 'open-stream':
      if (ui.openId) closeDrawer();
      goPage('#/stream');
      return;
    case 'mask-close': closeModal(); return;
    case 'mask': if (e.target === t) closeModal(); return;

    case 'filter': ui[t.dataset.g] = t.dataset.v; render(); return;
    case 'dismiss-back': ui.dismissedBack = true; render(); return;
    case 'reset-filter': ui.stage = 'all'; ui.health = 'all'; ui.due = 'all'; ui.q = ''; render(); return;
    case 'clear-q': ui.q = ''; render(); var qi = document.getElementById('qInput'); if (qi) qi.focus(); return;

    case 'export': exportData(); return;
    case 'exp-one': if (p) exportProject(p); return;
    case 'import-one': triggerOneImport(); return;
    case 'print': window.print(); return;
    case 'import': triggerImport(); return;
    case 'open-file': openFileDialog(); return;
    case 'save-as': saveAsFile(); return;
    case 'resume-file': resumeFile(); return;
    case 'flush-file': flushFile().then(function (ok) { toast(ok ? '已写入文件' : '写入失败，请重新选文件'); }); return;
    case 'sync-reload': reloadFromStore(); return;
    case 'sync-dismiss': externalPending = false; updateSyncBar(); toast('已忽略对方的改动，下次保存会覆盖'); return;
    case 'choose-dir': chooseDir(); return;
    case 'grant-dir': grantDir(); return;
    case 'open-restore': openRestore(); return;
    case 'restore-pick': restorePick(t.dataset.name); return;
    case 'backup-download': backupDownload(); return;
    case 'save-report': saveReport(); return;
    case 'clear':
      if (!confirm('会删掉全部 ' + state.projects.length + ' 个项目和 ' + (state.inbox || []).length + ' 条想法。' +
        (prefs.footExport ? '建议先导出备份。' : '想要留一份，先去「设置」里打开「导出下载」，或点「保存到文件」。') +
        '清空后 6 秒内还能撤销。确定清空吗？')) return;
      var clrSnap = payloadText();
      state.projects = []; state.inbox = []; backInfo = null; resetFilters(); save(); closeDrawer(); render();
      toastUndo('已清空全部项目', function () {
        var d = parsePayload(clrSnap);
        if (!d) { toast('撤销失败：数据读不回来'); return; }
        applyPayload(d);
        toast('已撤销，全部回来了');
      });
      return;
    case 'seed':
      if (state.projects.length && !confirm('会覆盖当前项目，确定载入示例数据？')) return;
      state.projects = seedProjects(); backInfo = null; resetFilters(); save(); render(); toast('已载入示例数据'); return;

    case 'report-regen': render(); toast('已按当前数据重新生成'); return;
    case 'report-copy': copyReport(); return;
    case 'report-download': downloadReport(); return;

    case 'inbox-add': addInboxItem(); return;
    case 'inbox-del':
      state.inbox = (state.inbox || []).filter(function (i) { return i.id !== t.dataset.iid; });
      persistAndRender(); return;
    case 'inbox-tag':
      var it = (state.inbox || []).filter(function (i) { return i.id === t.dataset.iid; })[0];
      if (!it) return;
      it.tag = IDEA_TAGS[(IDEA_TAGS.indexOf(it.tag) + 1) % IDEA_TAGS.length];
      persistAndRender(); toast('已标记为「' + it.tag + '」'); return;
    case 'inbox-to':
      var it2 = (state.inbox || []).filter(function (i) { return i.id === t.dataset.iid; })[0];
      if (!it2) return;
      pendingInboxId = it2.id;
      openModal(projectForm({ name: it2.text.slice(0, 60), stage: '立项', progress: 0, due: '', next: '', link: '', desc: it2.text }));
      return;
  }

  if (!p) return;

  switch (act) {
    case 'del':
      if (!confirm('确定删除「' + p.name + '」？里程碑、阻塞和流水会一起删除。')) return;
      var delSnap = payloadText();                       /* 删之前留一份，够撤销用 */
      state.projects = state.projects.filter(function (x) { return x.id !== p.id; });
      closeDrawer(); save(); render();
      toastUndo('已删除「' + p.name + '」', function () {
        var d = parsePayload(delSnap);
        if (!d) { toast('撤销失败：数据读不回来'); return; }
        applyPayload(d);
        toast('已撤销，项目回来了');
      });
      return;

    case 'pin':
      p.pinned = !p.pinned;
      p.updatedAt = new Date().toISOString();
      logEvent(p, 'pin', p.pinned ? '置顶：卡片排到最前面' : '取消置顶');
      persistAndRender();
      toast(p.pinned ? '已置顶，下次打开还在前面' : '已取消置顶');
      return;

    case 'shelve':
      if (p.shelved) {
        var oldReason = p.shelveReason;
        p.shelved = false;
        p.shelvedAt = null;
        p.shelveReason = '';
        p.updatedAt = new Date().toISOString();
        logEvent(p, 'shelve', '取消搁置：重新进入进行中' + (oldReason ? '（原搁置原因：' + oldReason + '）' : ''));
        persistAndRender(); return;
      }
      openModal(shelveForm(p, false)); return;

    case 'shelve-reason':
      openModal(shelveForm(p, true)); return;

    case 'ms-toggle':
      var m = (p.milestones || []).filter(function (x) { return x.id === t.dataset.mid; })[0];
      if (!m) return;
      m.done = !m.done;
      if (m.done) { m.doneAt = new Date().toISOString(); logEvent(p, 'milestone', '里程碑完成：' + m.title); }
      else { m.doneAt = null; logEvent(p, 'milestone_undo', '里程碑取消勾选：' + m.title); }
      persistAndRender(); return;

    case 'ms-del':
      p.milestones = (p.milestones || []).filter(function (x) { return x.id !== t.dataset.mid; });
      p.updatedAt = new Date().toISOString();
      persistAndRender(); return;

    case 'ms-add': addMilestone(p); return;
    case 'blk-add': addBlocker(p); return;

    case 'blk-resolve':
      var b = (p.blockers || []).filter(function (x) { return x.id === t.dataset.bid; })[0];
      if (!b) return;
      b.resolvedAt = new Date().toISOString();
      logEvent(p, 'blocker_resolved', '阻塞已解决：' + b.text);
      persistAndRender(); toast('已标记解决，记录保留'); return;

    case 'blk-reopen':
      var b2 = (p.blockers || []).filter(function (x) { return x.id === t.dataset.bid; })[0];
      if (!b2) return;
      b2.resolvedAt = null;
      logEvent(p, 'blocker', '阻塞重新打开：' + b2.text + '（开始 ' + md(b2.start) + '）');
      persistAndRender(); return;

    case 'next-save': saveNext(p, true); return;

    case 'idea-tag':
      var idea = (p.ideas || []).filter(function (x) { return x.id === t.dataset.iid; })[0];
      if (!idea) return;
      idea.tag = IDEA_TAGS[(IDEA_TAGS.indexOf(idea.tag) + 1) % IDEA_TAGS.length];
      p.updatedAt = new Date().toISOString();
      persistAndRender(); return;

    case 'idea-del':
      p.ideas = (p.ideas || []).filter(function (x) { return x.id !== t.dataset.iid; });
      p.updatedAt = new Date().toISOString();
      persistAndRender(); return;
  }
});

document.addEventListener('change', function (e) {
  var t = e.target;

  if (t.dataset && t.dataset.act === 'progress-drag') {
    var p = find(t.dataset.id);
    if (!p) return;
    var to = parseInt(t.value, 10);
    if (!isFinite(to) || to === p.progress) return;
    var from = p.progress;
    p.progress = Math.max(0, Math.min(100, to));
    logEvent(p, 'progress', '进度从 ' + from + '% 到 ' + p.progress + '%', { from: from, to: p.progress });
    save();
    renderListOnly();
    /* 抽屉就地重画并把焦点还回手柄：用方向键调进度时不会按一下就丢焦点 */
    if (ui.openId) {
      renderDrawer();
      var sl = document.getElementById('prange');
      if (sl) { sl.focus(); sl.style.setProperty('--fill', sl.value + '%'); }
    }
    toast('已记录：' + from + '% → ' + p.progress + '%');
    return;
  }

  if (t.dataset && t.dataset.act === 'set-stage') {
    var p2 = find(t.dataset.id);
    if (!p2 || p2.stage === t.value) return;
    var oldStage = p2.stage;
    p2.stage = t.value;
    logEvent(p2, 'stage', '阶段：' + oldStage + ' → ' + t.value);
    persistAndRender(); return;
  }

  if (t.id === 'importFile') importFile(t);
  if (t.id === 'importOneFile') importOneFile(t);
  if (t.dataset && t.dataset.pref) {
    prefs[t.dataset.pref] = !!t.checked;
    savePrefs();
    render();

/* 署名这类纯文本偏好：边打字边存，不重绘，免得打断输入 */

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && e.target && e.target.id === 'qInput') {
    if (ui.q) { ui.q = ''; e.target.value = ''; renderListOnly(); }
    e.target.blur();
    return;
  }
  if (e.key === 'Escape') {
    var mask = document.querySelector('.modal-mask');
    if (mask) { closeModal(); return; }          /* 先只关弹窗，抽屉留着 */
    /* 「下一个动作」是按失焦存盘的，关抽屉前补存一次，别让刚敲的字白丢 */
    var ni = document.getElementById('nextInput');
    if (ni) { var pn = find(ni.dataset.id); if (pn) saveNext(pn, false); }
    if (ui.openId) closeDrawer();
    return;
  }

  /* Ctrl/Cmd + S：立即写盘（有绑定文件优先，其次今日快照） */
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') {
    e.preventDefault();
    if (fileHandle) flushFile().then(function (ok) { toast(ok ? '已写入 ' + fileHandleLabel : '写入失败，点「保存到文件」重新授权'); });
    else if (dirHandle) writeSnapshot(true).then(function (r) { toast(r === 'ok' ? '今日快照已存' : '备份文件夹没写成，重新授权一下'); });
    else toast('还没绑定文件：页脚点「保存到文件」或「设置自动备份文件夹」');
    return;
  }

  var t = e.target;
  var tag = String((t && t.tagName) || '').toLowerCase();
  var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (t && t.isContentEditable);

  /* 输入框里的回车提交（先于单键快捷键判断） */
  if (e.key === 'Enter' && t && t.dataset && t.dataset.add) {
    if (t.dataset.add === 'ms' && e.shiftKey) return;   /* Shift+回车 在批量框里换行 */
    e.preventDefault();
    if (t.dataset.add === 'inbox') { addInboxItem(); return; }
    var p = find(t.dataset.id);
    if (!p) return;
    if (t.dataset.add === 'ms') addMilestone(p);
    if (t.dataset.add === 'blk') addBlocker(p);
    if (t.dataset.add === 'idea') addIdea(p);
    return;
  }
  if (e.key === 'Enter' && t && t.id === 'nextInput') {
    e.preventDefault();
    var p3 = find(t.dataset.id);
    if (p3) saveNext(p3, true);
    return;
  }

  if (typing) return;
  /* 有弹窗时只留 Esc / Ctrl+S，避免在弹窗后面切页或再叠一个弹窗 */
  if (document.querySelector('.modal-mask')) return;

  /* 卡片可聚焦，回车 / 空格直接打开（不动鼠标也能进详情） */
  if ((e.key === 'Enter' || e.key === ' ') && t && t.dataset && t.dataset.act === 'open' && t.dataset.id) {
    e.preventDefault(); openDrawer(t.dataset.id); return;
  }

  /* 单键快捷键：只在没在输入时生效 */
  if (e.key === '/') {
    e.preventDefault();
    /* 抽屉盖着的时候搜索框在后面看不见，先把抽屉收掉再聚焦 */
    if (ui.openId) closeDrawer();
    focusSearch(); return;
  }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openModal(projectForm(null)); return; }
  if (e.key === '1') { e.preventDefault(); goPage('#/'); return; }
  if (e.key === '2') { e.preventDefault(); goPage('#/report'); return; }
  if (e.key === '3') { e.preventDefault(); goPage('#/stream'); return; }
  if (e.key === '?') { e.preventDefault(); toast('快捷键：/ 搜索 · n 新建 · 1 总览 · 2 周报 · 3 流水 · 回车开卡片 · Ctrl+S 立即保存 · Esc 关闭'); return; }
});

document.addEventListener('submit', function (e) {
  if (e.target.id === 'shForm') {

    else logEvent(sp, 'shelve', '更新搁置原因' + (reason ? '：' + reason : '（清空）'));

  var data = {

    next: String(fd.get('next') || '').trim().slice(0, 120),

  };

  if (idv) {

    if (p) {

      p.name = data.name; p.stage = data.stage; p.due = data.due;
      p.next = data.next; p.link = data.link; p.desc = data.desc;
      if (data.progress !== oldProg) {
        p.progress = data.progress;
        logEvent(p, 'progress', '进度从 ' + oldProg + '% 到 ' + data.progress + '%', { from: oldProg, to: data.progress });
      }
      if (oldStage !== data.stage) logEvent(p, 'stage', '阶段：' + oldStage + ' → ' + data.stage);
      if (oldNext !== data.next) logEvent(p, 'next', '更新下一个动作：' + (data.next || '（清空）'));
      p.updatedAt = new Date().toISOString();

  } else {
    var now = new Date().toISOString();
    var np = {
      id: uid(), name: data.name, stage: data.stage, progress: data.progress,
      due: data.due, next: data.next, link: data.link, desc: data.desc,
      createdAt: now, updatedAt: now,
      milestones: [], blockers: [], ideas: [],
      events: [{ id: uid(), at: now, type: 'created', text: '项目创建，阶段：' + data.stage + '，进度 ' + data.progress + '%' }]
    };
    var copyFrom = String(fd.get('copyFrom') || '');
    if (copyFrom) {

       否则导出再导入会「看起来不一样」（少 shelved / pinned 这几个键） */
    state.projects.unshift(normalizeProject(np));
    if (pendingInboxId) {

      pendingInboxId = null;
    }

  closeModal();
  persistAndRender();
});

/* 从已有项目复制结构：只带里程碑标题，不带日期和流水 */
function applyTemplate(target, source) {
  if (!target || !source) return 0;
  var ms = (source.milestones || []).filter(function (m) { return m && m.title; });
  target.milestones = ms.map(function (m) {
    return { id: uid(), title: m.title, date: '', done: false, doneAt: null };
  });
  if (target.milestones.length) {
    logEvent(target, 'template', '从「' + source.name + '」复制了 ' + target.milestones.length + ' 个里程碑');
  }
  return target.milestones.length;
}

/* ---------- 增改 helper ---------- */
function logEvent(p, type, text, extra) {
  if (!Array.isArray(p.events)) p.events = [];
  /* from / to 一律给上（没有就 null）：跟 normalizeProject 出来的形状对齐，
     否则「导出→导入」后每条流水的键都不一样，看起来像没还原干净 */
  var e = {
    id: uid(), at: new Date().toISOString(), type: type, text: text,
    from: (extra && extra.from != null) ? extra.from : null,
    to: (extra && extra.to != null) ? extra.to : null
  };
  if (extra) Object.keys(extra).forEach(function (k) { if (k !== 'from' && k !== 'to') e[k] = extra[k]; });
  p.events.push(e);
  p.updatedAt = e.at;
}
/* 批量加里程碑：一行一个，行尾 @2026-11-24 或 @11.24 指定日期，行首 - / 1. 自动去掉 */
function parseMilestoneLines(text, fallbackDate) {
  var out = [];
  String(text || '').split(/\r?\n/).forEach(function (raw) {
    var s = String(raw).trim()
      .replace(/^[-*·•]\s*/, '')
      .replace(/^\d+[.、)）]\s*/, '')
      .replace(/\s+/g, ' ');
    if (!s) return;
    var date = fallbackDate || '';
    var mm = s.match(/@(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}[./]\d{1,2})\s*$/);
    if (mm) {
      var tok = mm[1], iso;
      if (/^\d{4}-/.test(tok)) {
        var a = tok.split('-');
        iso = a[0] + '-' + pad2(a[1]) + '-' + pad2(a[2]);
      } else {
        var b = tok.split(/[./]/);
        iso = new Date().getFullYear() + '-' + pad2(b[0]) + '-' + pad2(b[1]);
      }
      var chk = new Date(iso + 'T00:00:00');
      if (isRealDate(iso) && !isNaN(chk.getTime())) date = iso;
      s = s.slice(0, mm.index).trim();
    }
    if (!s) return;
    out.push({ title: s.slice(0, 120), date: date });
  });
  return out;
}
function addMilestone(p) {
  var el = document.querySelector('[data-add="ms"][data-id="' + p.id + '"]');
  var dt = document.querySelector('[data-ms-date="' + p.id + '"]');
  if (!el) return;
  var rows = parseMilestoneLines(el.value, (dt && dt.value) || '');
  if (!rows.length) { el.focus(); return; }
  p.milestones = p.milestones || [];
  var existing = {};
  p.milestones.forEach(function (m) { existing[String(m.title || '').trim().toLowerCase()] = 1; });
  var added = 0, dup = 0;
  rows.forEach(function (r) {
    var key = r.title.toLowerCase();
    if (existing[key]) { dup++; return; }
    existing[key] = 1;
    p.milestones.push({ id: uid(), title: r.title, date: r.date, done: false, doneAt: null });
    logEvent(p, 'milestone_add', '新增里程碑：' + r.title + (r.date ? '（' + md(r.date) + '）' : ''));
    added++;
  });
  el.value = '';
  persistAndRender();
  toast(added + ' 个里程碑已加' + (dup ? '，跳过 ' + dup + ' 个重复' : ''));
  var again = document.querySelector('[data-add="ms"][data-id="' + p.id + '"]');
  if (again) again.focus();
}
function addBlocker(p) {
  var el = document.querySelector('[data-add="blk"][data-id="' + p.id + '"]');
  var dt = document.querySelector('[data-blk-start="' + p.id + '"]');
  if (!el) return;
  var v = el.value.trim();
  if (!v) { toast('先写清楚卡在哪件事上'); el.focus(); return; }
  var start = dt && dt.value ? dt.value : '';
  if (!start) { toast('开始日期必填'); if (dt) dt.focus(); return; }
  var text = v.slice(0, 160);
  p.blockers = p.blockers || [];
  p.blockers.push({ id: uid(), text: text, start: start, resolvedAt: null });
  logEvent(p, 'blocker', '新增阻塞：' + text + '（开始 ' + md(start) + '）');
  persistAndRender(); toast('已记录阻塞');
  var again = document.querySelector('[data-add="blk"][data-id="' + p.id + '"]');
  if (again) again.focus();
}
function addIdea(p) {
  var el = document.querySelector('[data-add="idea"][data-id="' + p.id + '"]');

/* ==================================================================
   十二、本地文件（打开 / 保存真实的 .json，带降级）
   ------------------------------------------------------------------
   有 File System Access API：绑定一个文件，之后每次改动自动写回；
   没有：打开走文件选择框，保存走下载。localStorage 仍然照写，双保险。
   ================================================================== */
var fileHandle = null;        // 当前绑定
var fileHandleLabel = '';
var pendingHandle = null;     // 上次用过、还没续权的文件
var fileState = '';           // '' | writing | saved | error | denied
var writeTimer = null;

function fsSaveSupported() { return typeof window.showSaveFilePicker === 'function'; }
function fsOpenSupported() { return typeof window.showOpenFilePicker === 'function'; }

function payloadObject() {
  var o = { version: VERSION, exportedAt: new Date().toISOString(), projects: state.projects, inbox: state.inbox || [] };
  if (authorName()) o.by = authorName();
  return o;
}
function payloadText() { return JSON.stringify(payloadObject(), null, 2); }

/* 识别我们的备份格式；别的 JSON 一律不认，避免误覆盖 */
function parsePayload(text) {
  var o = null;
  try { o = JSON.parse(String(text)); } catch (e) { return null; }
  var arr = Array.isArray(o) ? o : (isObj(o) && Array.isArray(o.projects) ? o.projects : null);
  if (!arr) return null;
  var objs = arr.filter(isObj);
  var inbox = (isObj(o) && Array.isArray(o.inbox)) ? o.inbox.filter(isObj) : [];
  /* 空库备份也要能还原：带 version / exportedAt 标记的才认 */
  if (!objs.length) {
    if (!inbox.length && !(isObj(o) && (o.version != null || o.exportedAt != null))) return null;
    return { projects: [], inbox: inbox };
  }
  var looksLikeProjects = objs.some(function (x) {
    return x.name != null || x.progress != null || x.milestones != null || x.blockers != null;
  });
  if (!looksLikeProjects) return null;
  return { projects: objs, inbox: inbox };
}
function applyPayload(data) {
  state.projects = (data.projects || []).map(normalizeProject);
  state.inbox = (data.inbox || []).map(normalizeInboxItem);
  healIds(state);
  ui.q = ''; ui.stage = 'all'; ui.health = 'all'; ui.due = 'all';   /* 换了一份数据，筛选跟着归位，免得看起来像空的 */
  backInfo = null;                                                   /* 数据整个换了，「上次到现在」的说法不再成立 */
  save(); closeDrawer(); render();
}

function fileStatusHtml() {
  if (fileHandle) {
    var txt = {
      writing: '正在写入…',
      saved: '已保存',
      error: '写入失败，点「保存到文件」重新授权',
      denied: '需要重新授权才能写入'
    }[fileState] || '改动会自动写回这个文件';
    var tone = fileState === 'error' || fileState === 'denied' ? 'bad' : (fileState === 'saved' ? 'ok' : '');
    return '<span class="fstat"' + (tone ? ' data-tone="' + tone + '"' : '') + '>' +
      '<i class="fdot"></i><b>' + esc(fileHandleLabel || '所选文件') + '</b>' + esc(txt) + '</span>' +
      '<button class="btn btn-ghost btn-sm" data-act="flush-file">立即保存</button>';
  }
  if (pendingHandle) {
    return '<span class="fstat"><i class="fdot"></i><b>' + esc(fileHandleLabel || '上次的文件') + '</b>上次用的文件</span>' +
      '<button class="btn btn-sm" data-act="resume-file">继续用它</button>';
  }
  return '<span class="fstat"><i class="fdot"></i>数据存在本机浏览器；想更稳就「保存到文件」</span>';
}
function setFileStatus(kind) {
  if (kind) fileState = kind;
  var el = document.getElementById('fileStatus');
  if (el) el.innerHTML = fileStatusHtml() + dirStatusHtml() + backupChipHtml();
}

/* ---------- IndexedDB：把文件句柄留下来，下次还能接着用 ---------- */
function idbOpen() {
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) return reject(new Error('no idb'));
    var rq = indexedDB.open('pw_files', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
    rq.onsuccess = function () { resolve(rq.result); };
    rq.onerror = function () { reject(rq.error); };
  });
}
function idbPut(key, val) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = function () { res(true); };
      tx.onerror = function () { rej(tx.error); };
    });
  }).catch(function () { return false; });
}
function idbGet(key) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var rq = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      rq.onsuccess = function () { res(rq.result || null); };
      rq.onerror = function () { rej(rq.error); };
    });
  }).catch(function () { return null; });
}

/* ---------- 绑定与写入 ---------- */
function bindHandle(h, label) {
  fileHandle = h;
  fileHandleLabel = label || (h && h.name) || '所选文件';
  pendingHandle = null;
  fileState = '';
  idbPut('handle', h);
  setFileStatus();
}
function flushFile() {
  if (!fileHandle) return Promise.resolve(false);
  var text = payloadText();
  return Promise.resolve()
    .then(function () {
      if (typeof fileHandle.queryPermission !== 'function') return 'granted';
      return fileHandle.queryPermission({ mode: 'readwrite' });
    })
    .then(function (st) {
      if (st !== 'granted') return 'need-permission';
      return fileHandle.createWritable().then(function (w) {
        return Promise.resolve(w.write(text)).then(function () { return w.close(); });
      }).then(function () { return 'ok'; });
    })
    .then(function (r) {
      if (r === 'ok') { setFileStatus('saved'); markSaved(); return true; }
      if (r === 'need-permission') { setFileStatus('denied'); return false; }
      return false;
    })
    .catch(function () { setFileStatus('error'); return false; });
}
function scheduleFileWrite() {
  if (!fileHandle) return;
  setFileStatus('writing');
  clearTimeout(writeTimer);
  writeTimer = setTimeout(function () { flushFile(); }, 500);
}

/* ---------- 打开 / 另存 / 续用 ---------- */
function triggerImport() {
  var el = document.getElementById('importFile');
  if (el) el.click();
}
function openFileDialog() {
  if (!fsOpenSupported()) { triggerImport(); return; }
  window.showOpenFilePicker({

/* ---------- 每日快照（一个文件夹，每天第一次改动存一份） ---------- */
var SNAP_KEY = 'pw_snap_day';

function pad2(n) { n = Number(n); return (n < 10 ? '0' : '') + n; }

  var yStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

function snapName(d) { return '项目工作台-' + dateISO(d || new Date()).replace(/-/g, '') + '.json'; }

}

function dirStatusHtml() {

function bindDir(h, label) {
  dirHandle = h;
  dirLabel = label || (h && h.name) || '所选文件夹';
  pendingDir = null;
  snapErr = false;
  setDirBlocked(false);
  lastLatestAt = Date.now() - LATEST_GAP;   /* 绑定后第一次改动就立刻写，不用等节流 */
  lastLatestBody = '';
  idbPut('dir', h);
  setFileStatus();
}
function writeSnapshot(force) {
  if (!dirHandle) return Promise.resolve('no-dir');
  var today = todayISO();
  var marker = null;
  try { marker = localStorage.getItem(SNAP_KEY); } catch (e) {}
  if (!force && marker === today) return Promise.resolve('skip');
  var text = payloadText();
  var name = snapName();
  return dirHandle.getFileHandle(name, { create: true }).then(function (fh) {
    return fh.createWritable().then(function (w) {
      return Promise.resolve(w.write(text)).then(function () { return w.close(); });
    });
  }).then(function () {
    try { localStorage.setItem(SNAP_KEY, today); } catch (e) {}
    snapErr = false;
    markSaved();
    pruneSnapshots();
    setFileStatus();
    return 'ok';
  }).catch(function () {
    snapErr = true;
    setFileStatus();
    return 'error';
  });
}
function pruneSnapshots() {  if (!dirHandle || typeof dirHandle.values !== 'function' || typeof dirHandle.removeEntry !== 'function') return;
  var names = [];
  var RE = /^项目工作台-\d{8}\.json$/;
  var it = dirHandle.values();
  function step() {
    return it.next().then(function (r) {
      if (r.done) return;
      if (r.value && r.value.kind === 'file' && RE.test(r.value.name)) names.push(r.value.name);
      return step();
    });
  }
  step().then(function () {
    var old = names.sort().slice(0, Math.max(0, names.length - SNAP_KEEP));
    old.forEach(function (n) { dirHandle.removeEntry(n).catch(function () {}); });
  }).catch(function () {});
}
/* 自动备份：改动后 20 秒内把「最新」写进这个文件夹（坚果云这类同步盘会自动上传），
   每天再另留一份带日期的快照，防止误改后找不回。 */
var LATEST_NAME = '项目工作台-最新.json';
var LATEST_GAP = 20000;
var latestTimer = null;
var lastLatestAt = 0;
var lastLatestBody = '';

function writeLatest() {
  if (!dirHandle) return Promise.resolve('no-dir');
  return new Promise(function (res) {
    clearTimeout(latestTimer);
    var wait = Math.max(0, LATEST_GAP - (Date.now() - lastLatestAt));
    latestTimer = setTimeout(function () {
      var text = payloadText();
      if (text === lastLatestBody) { res('same'); return; }
      dirHandle.getFileHandle(LATEST_NAME, { create: true }).then(function (fh) {
        return fh.createWritable().then(function (w) {
          return Promise.resolve(w.write(text)).then(function () { return w.close(); });
        });
      }).then(function () {
        lastLatestAt = Date.now();
        lastLatestBody = text;
        snapErr = false;
        markSaved();
        setFileStatus();
        res('ok');
      }).catch(function () { snapErr = true; setFileStatus(); res('error'); });
    }, wait);
  });
}

function scheduleSnapshot() {
  if (!dirHandle) return;
  writeLatest();
  var marker = null;
  try { marker = localStorage.getItem(SNAP_KEY); } catch (e) {}
  if (marker === todayISO()) return;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(function () { writeSnapshot(false); }, 900);
}
function chooseDir() {

    bindDir(h, h.name || '工作文件夹');

    toast(r === 'ok' ? '设好了：改动 20 秒内自动写一份「最新」，每天再存一份带日期的快照' : '文件夹选好了，但这次没写进去');
  }).catch(function (e) {

/* ---------- 从备份文件夹恢复：能写进去，也得能读回来 ---------- */
function fmtDT(d) {
  return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function kbOf(n) { return n < 1024 ? (n + ' B') : (Math.round(n / 1024) + ' KB'); }
var BACKUP_RE = /^项目工作台-(最新|\d{8})\.json$/;
function listBackups() {
  if (!dirHandle || typeof dirHandle.values !== 'function') return Promise.resolve([]);
  var found = [];
  var it = dirHandle.values();
  function step() {
    return it.next().then(function (r) {
      if (r.done) return;
      var v = r.value;
      if (v && v.kind === 'file' && BACKUP_RE.test(v.name)) found.push(v);
      return step();
    });
  }
  return step().then(function () {
    return Promise.all(found.map(function (v) {
      return v.getFile().then(function (f) { return { name: v.name, size: f.size, at: f.lastModified }; })
        .catch(function () { return { name: v.name, size: 0, at: 0 }; });
    }));
  }).then(function (arr) {
    return arr.sort(function (a, b) {
      var al = a.name === LATEST_NAME, bl = b.name === LATEST_NAME;
      if (al !== bl) return al ? -1 : 1;                 /* 「最新」永远排第一 */
      return a.name < b.name ? 1 : -1;                    /* 其余按日期倒序 */
    });
  });
}
function readBackup(name) {
  return dirHandle.getFileHandle(name).then(function (fh) { return fh.getFile(); }).then(function (f) {
    if (typeof f.text === 'function') return f.text();
    return new Promise(function (res, rej) {
      var rd = new FileReader();
      rd.onload = function () { res(String(rd.result)); };
      rd.onerror = function () { rej(rd.error); };
      rd.readAsText(f);
    });
  });
}

  reader.onload = function () {

    if (!data) { alert('导入失败：文件里没有可识别的项目数据。'); input.value = ''; return; }
    if (!confirm('导入 ' + data.projects.length + ' 个项目、' + data.inbox.length + ' 条想法，会覆盖当前的 ' + state.projects.length + ' 个。继续吗？')) { input.value = ''; return; }
    applyPayload(data);

    input.value = '';
  };

  }
  if (!np.events) np.events = [];
  np.events.push({ id: uid(), at: now, type: 'import', text: '从文件导入：' + (fileName || '未命名文件') });
  return np;
}
function importOneFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    var o = null;
    try { o = JSON.parse(reader.result); } catch (e) { o = null; }
    if (isObj(o) && Array.isArray(o.projects)) {
      alert('这是整库备份，请用页脚的「打开文件」整体恢复。');
      input.value = ''; return;
    }
    var raw = isObj(o) && isObj(o.project) ? o.project : o;
    var np = projectFromPayload(raw, f.name);
    if (!np) {
      alert('导入失败：这不是单个项目文件。整库备份请用「打开文件」。');
      input.value = ''; return;
    }
    state.projects.unshift(np);
    persistAndRender();
    toast('已导入「' + np.name + '」，' + np.milestones.length + ' 个里程碑');
    input.value = '';
  };
  reader.onerror = function () { alert('读取文件失败。'); input.value = ''; };
  reader.readAsText(f);
}
