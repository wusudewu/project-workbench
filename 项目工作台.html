<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>项目工作台</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%23111"/><rect x="6" y="6" width="20" height="5" fill="%23fff"/><rect x="6" y="14" width="20" height="2" fill="%23fff"/><rect x="6" y="18" width="20" height="2" fill="%23fff"/><rect x="6" y="23" width="10" height="3" fill="%23e30613"/></svg>' />
<style>
/* ==================================================================
   项目工作台 · 步骤二：健康度推导 / 汇总条 / 筛选 / 流水 / 周报 / 到期提醒
   单文件、原生 JS、零外部依赖，断网可用
   ================================================================== */
:root{
  /* Swiss / 瑞士国际主义：纸白底、近黑墨、唯一强调色只给「风险」 */
  --bg:#f4f4f0;
  --surface:#ffffff;
  --ink:#111111;
  --ink-2:#3d3d3d;
  --ink-3:#5f5f5f;
  --line:#d8d8d2;
  --line-2:#ecece6;
  --rule:#111111;
  --accent:#111111;
  --accent-ink:#000000;
  --accent-soft:#f1f1ea;
  --bar:#4a4a45;
  --red:#e30613;
  --red-soft:#fbeceb;
  --amber:#96700f;
  --amber-soft:#f6f0dd;
  --green:#00694c;
  --radius:0px;
  --r-xs:0px;--r-sm:0px;--r-md:0px;--r-lg:0px;--r-xl:0px;--r-pill:0px;
  --shadow:none;
  --shadow-lg:none;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);
  background:var(--bg);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-weight:700;letter-spacing:.1px}
p{margin:0}
button,select,input,textarea{font-family:inherit}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar-inner{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:none}
.logo{width:34px;height:34px;border-radius:0;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:none}
.brand b{font-size:15.5px;display:block;line-height:1.2;font-weight:700}
.brand i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;gap:16px;background:none;border:0;border-radius:0;padding:0}
.nav a{padding:5px 0;border-radius:0;font-size:12.5px;color:var(--ink-2);text-decoration:none;transition:.14s}
.nav a:hover{background:none;color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.nav a[data-on="1"]{background:none;color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--rule)}
.spacer{margin-left:auto}
.btn{height:34px;padding:0 13px;border-radius:0;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink);background:#fff}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn-primary:hover{background:#000;border-color:#000}
.btn-sm{height:29px;padding:0 10px;font-size:12px;border-radius:0}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.only-narrow{display:none}
/* 键盘焦点：任何可操作元素都要看得见 */
*:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
.chip:focus-visible,.btn:focus-visible,.nav a:focus-visible{outline-offset:1px}

/* ---------- 汇总条 ---------- */
.summary{display:flex;align-items:stretch;background:none;border:0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line);border-radius:0;padding:14px 0;box-shadow:none;margin:22px 0 14px}
.sum{flex:1;padding:1px 18px;border-right:1px solid var(--line);min-width:0}
.sum:last-child{border-right:0}
.sum .k{font-size:11px;color:var(--ink-3);letter-spacing:.1em;white-space:nowrap}
.sum .v{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin-top:4px}
.sum .v small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px}
.sum[data-tone="danger"] .v{color:var(--red)}
.sum[data-tone="warn"] .v{color:var(--amber)}
@media (max-width:860px){.summary{flex-wrap:wrap;padding:12px 2px}.sum{flex:1 1 33%;border-right:0;padding:8px 16px}}

/* ---------- 隔几天回来的交代 ---------- */
.backbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:3px solid var(--rule);border-radius:0;padding:10px 14px;margin:16px 0 0;font-size:12.5px;color:var(--ink-2);box-shadow:none}
.backbar .ico{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-size:12px;flex:none}
.backbar b{color:var(--ink);font-weight:700}
.fhint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}

/* ---------- 到期提醒 ---------- */
.alertbar{
  display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--red);border-left:3px solid var(--red);border-radius:0;padding:10px 14px;margin-bottom:14px;
  font-size:12.5px;color:#8a121c;
}
.alertbar .ico{flex:none;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.alertbar b{color:var(--red)}
.alertbar .items{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.alertbar .pill{
  border:1px solid var(--line);background:#fff;color:#8a121c;border-radius:0;
  font-size:12px;padding:2px 9px;cursor:pointer;transition:.14s;
}
.alertbar .pill:hover{background:var(--red-soft);border-color:var(--red)}
.alertbar .pill em{font-style:normal;color:var(--red);font-weight:700}
.alertbar[data-tone="warn"]{background:#fff;border-color:var(--amber);border-left-color:var(--amber);color:#7d5b12}
.alertbar[data-tone="warn"] .ico{background:var(--amber)}
.alertbar[data-tone="warn"] .pill{border-color:var(--line);color:#7d5b12}
.alertbar[data-tone="warn"] .pill em{color:var(--amber)}

/* ---------- 筛选 ---------- */
.filters{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:0;padding:11px 14px;margin-bottom:15px;box-shadow:none}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flab{font-size:11px;color:var(--ink-3);width:44px;flex:none;letter-spacing:.1em;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;padding:4px 11px;border-radius:0;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--accent-soft);color:var(--ink);border-color:var(--ink)}
.chip[data-on="1"]{background:var(--ink);color:#fff;font-weight:700;border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.frow .count{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.searchbox{display:flex;align-items:center;gap:6px;flex:0 1 420px;min-width:190px}
.searchbox input{flex:1;min-width:0;height:30px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;font-size:12.5px;padding:0 2px;color:var(--ink);outline:none;transition:.14s}
.searchbox input:focus{border-color:var(--ink);box-shadow:none}
.searchbox input::placeholder{color:#a9a9a2}
.searchbox .qclear{border:0;background:transparent;color:var(--ink-3);font-size:15px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:0;flex:none}
.searchbox .qclear:hover{background:var(--accent-soft);color:var(--ink)}

/* ---------- 卡片墙 ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px}
.card{
  position:relative;background:var(--surface);border:0;border-left:3px solid var(--line);
  border-radius:0;padding:15px 16px 13px;box-shadow:none;cursor:pointer;
  transition:background .14s;display:flex;flex-direction:column;gap:10px;
}
.card:hover{transform:none;box-shadow:none;background:#eeeede}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card[data-h="risk"]{border-left-color:var(--red)}
.card[data-h="watch"]{border-left-color:#b8860b}
.card[data-h="good"]{border-left-color:var(--green)}
.card[data-h="shelved"]{border-left-color:#b6b8b2;opacity:.9}
.card[data-h="shelved"]:hover{opacity:1}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.hdot{width:8px;height:8px;border-radius:50%;flex:none;position:relative}
.hdot[data-h="risk"]{background:var(--red)}
.hdot[data-h="watch"]{background:var(--amber)}
.hdot[data-h="good"]{background:var(--green)}
.hdot[data-h="shelved"]{background:#b6b8b2}
.hdot::after{content:"";position:absolute;inset:-4px;border-radius:50%;opacity:.16}
.hdot[data-h="risk"]::after{background:var(--red)}
.hdot[data-h="watch"]::after{background:var(--amber)}
.hdot[data-h="good"]::after{background:var(--green)}
.card-top h3{font-size:14.5px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.stage{font-size:11px;padding:2px 7px;border-radius:0;background:none;border:1px solid var(--line);color:var(--ink-2);font-weight:600;flex:none}
.shelvetag{font-size:11px;padding:2px 7px;border-radius:0;background:none;border:1px solid var(--line);color:var(--ink-3);font-weight:600;flex:none}
.progress-row{display:flex;align-items:center;gap:9px}
.pbar{flex:1;height:6px;border-radius:0;background:#e3e3dc;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:0;background:var(--bar);transition:width .35s}
.pbar[data-done="1"] i{background:#b8b8b1}
.card[data-h="risk"] .pbar i{background:var(--red)}
.card[data-h="watch"] .pbar i{background:var(--amber)}
.card[data-h="good"] .pbar i{background:var(--green)}
.card[data-h="shelved"] .pbar i{background:#b6b8b2}
.pct{font-size:13px;font-weight:800;flex:none;min-width:36px;text-align:right}
.nextline{display:flex;align-items:baseline;gap:7px;font-size:12.5px;min-width:0}
.nextline em{font-style:normal;font-size:11.5px;color:var(--ink-3);flex:none}
.nextline span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:9px;margin-top:auto;flex-wrap:wrap}
.due{font-weight:700;color:var(--ink-2)}
.due[data-state="late"]{color:var(--red)}
.due[data-state="today"]{color:var(--amber)}
.due[data-state="soon"]{color:var(--amber)}
.due[data-state="done"]{color:var(--ink-3);font-weight:500}
.due[data-state="shelved"]{color:var(--ink-3);font-weight:500}
.blocked{color:#fff;background:var(--red);padding:1px 6px;border-radius:0;font-weight:700}
.idle{color:var(--ink-3)}
.idle[data-stale="1"]{color:var(--amber);font-weight:600}
/* 卡片上的编辑 / 删除：常显，但不抢注意力 */
.card-acts{display:flex;gap:6px;justify-content:flex-end}
.card-acts .btn{height:24px;padding:0 7px;font-size:11.5px;border-color:transparent;background:transparent;color:var(--ink)}
.card-acts .btn:hover{border-color:var(--line);background:#e2e2d6}

/* ---------- 宽屏：一行一项目（密度优先，扫一眼就能看完） ----------
   窄屏仍用原来的竖卡片，靠下面的 min-width 收口，不用另写回退 */
@media (min-width:1000px){
  .wall{display:flex;flex-direction:column;gap:9px}
  .wall.arch{gap:9px}
  .card{
    display:grid;grid-template-columns:220px 96px minmax(140px,1fr) 300px 86px;
    align-items:center;column-gap:16px;row-gap:0;padding:12px 14px;border-radius:0;
    background:transparent;border-bottom:1px solid var(--line);
  }
  .card:hover{transform:none;box-shadow:none;background:#eeeede}
  .card .card-top{min-width:0}
  .card .progress-row{gap:8px}
  .card .pct{min-width:34px;font-size:12.5px}
  .card .nextline{min-width:0}
  .card .nextline em{display:none}
  .card .card-foot{
    border-top:0;margin:0;padding:0;font-size:11px;gap:8px;row-gap:2px;
    justify-content:flex-end;
  }
  .card .card-foot > *{flex:none;white-space:nowrap}
  .card .due{white-space:nowrap}
  .card[data-h="shelved"]{opacity:1}
}

/* ---------- 已交付折叠层 ---------- */
.archbar{display:flex;justify-content:center;margin:22px 0 4px}
.archbtn{background:none;border:1px solid var(--line);border-radius:0;padding:7px 16px;
  color:var(--ink-3);font-size:12px;cursor:pointer;transition:border-color .15s,color .15s}
.archbtn:hover{border-color:var(--ink);color:var(--ink)}
.wall.arch{margin-top:12px;opacity:.94}

/* ---------- 设置 ---------- */
.pref{margin:0;padding:13px 2px;border:0;border-top:1px solid var(--line);border-radius:0}
.pref label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
.pref label input{width:15px;height:15px;accent-color:var(--accent)}
.pref p{margin:6px 0 0 23px;font-size:12px;color:var(--ink-3);line-height:1.6}
.pref-text{margin:8px 0 0 23px;width:calc(100% - 23px);max-width:260px;height:31px;border:1px solid var(--line);border-radius:0;background:#fff;font-size:12.5px;padding:0 8px;color:var(--ink)}
.pref-text::placeholder{color:var(--ink-3)}
.pref:last-child{border-bottom:1px solid var(--line);margin-bottom:6px}
/* 设置里的接入步骤（可折叠） */
.how{margin:9px 0 0 23px}
.how summary{font-size:12px;color:var(--ink-2);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:2px;outline:none}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"+";font-weight:700;color:var(--ink);line-height:1}
.how[open] summary::before{content:"–"}
.how summary:hover{color:var(--ink);border-bottom-color:var(--ink)}
.how summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.how ol,.how ul{margin:9px 0 0;font-size:12px;line-height:1.85;color:var(--ink-2)}
.how ol{padding-left:22px}
.how ul{padding-left:18px}
.how li{margin-bottom:4px}
.how b{color:var(--ink);font-weight:600}
.how .p{user-select:all;background:#f6f6f3;border:1px solid var(--line);padding:1px 4px;font-size:11px;color:var(--ink);word-break:break-all}
.how .tip{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
/* 长弹窗（设置）的关闭按钮放在标题行右侧，不用滚到底去找 */
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-22px;z-index:3;background:#fff;padding:22px 0 9px;margin:-22px 0 12px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.modal-head{top:-17px;padding-top:17px;margin-top:-17px}}
.modal-head h2{margin:0}
.modal-head .btn-ghost{border-color:var(--line);background:#fff;color:var(--ink)}
.modal-head .btn-ghost:hover{border-color:var(--ink);background:var(--accent-soft)}
/* 从备份恢复：文件夹里的快照列表 */
.rst-list{margin-top:4px;border-top:1px solid var(--line)}
.rst-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.rst-main{min-width:0}
.rst-main b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.rst-meta{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.rst-row .btn{flex:none}
.pref-btn{margin:9px 0 0 23px}

/* ---------- 空状态 ---------- */
.empty-wall{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--rule);border-radius:0;padding:44px 30px;text-align:center;box-shadow:none}
.empty-wall h2{font-size:17px;margin:0 0 6px}
.empty-wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
.empty-wall .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.inner-empty{padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(17,17,17,.34);animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(630px,100%);z-index:61;background:var(--surface);
  border-left:1px solid var(--rule);box-shadow:none;display:flex;flex-direction:column;
  animation:slide .22s cubic-bezier(.22,.9,.3,1);
}
@keyframes slide{from{transform:translateX(24px);opacity:.75}to{transform:none;opacity:1}}
.drawer-scroll{overflow:auto;padding:14px 20px 32px}
.d-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--rule);padding:13px 20px 11px}
.d-top{display:flex;align-items:flex-start;gap:10px}
.d-top h2{font-size:19px;margin:0;line-height:1.35;flex:1;letter-spacing:-.2px}
.d-acts{display:flex;gap:6px;flex:none;margin-top:1px}
.d-acts .btn{height:27px;padding:0 10px;font-size:11.5px}
.d-acts .d-del{border-color:transparent;background:transparent;color:var(--ink)}
.d-acts .d-del:hover{border-color:var(--line);background:var(--accent-soft)}
.d-close{flex:none;width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.d-close:hover{background:var(--accent-soft);color:var(--ink)}
.d-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-3)}
.d-meta .btn-sm{height:27px;padding:0 8px;font-size:11.5px}
.d-meta .sep{width:1px;height:11px;background:var(--line)}
.hchip{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:5px}
.hchip[data-h="risk"]{background:var(--red-soft);color:#8a121c}
.hchip[data-h="watch"]{background:var(--amber-soft);color:var(--amber)}
.hchip[data-h="good"]{background:var(--accent-soft);color:var(--green)}
.hchip[data-h="shelved"]{background:var(--accent-soft);color:var(--ink-3)}
.hchip .dot{width:7px;height:7px;border-radius:50%}
.hchip[data-h="risk"] .dot{background:var(--red)}
.hchip[data-h="watch"] .dot{background:var(--amber)}
.hchip[data-h="good"] .dot{background:var(--green)}
.hchip[data-h="shelved"] .dot{background:#b6b8b2}
.sel{height:28px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:12px;padding:0 8px;color:var(--ink);outline:none;cursor:pointer}
.sel:focus{border-color:var(--ink)}
.linkbtn{border:0;background:transparent;color:var(--ink);font-size:12px;cursor:pointer;padding:2px 4px;border-radius:var(--r-xs);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{background:var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px 13px;box-shadow:var(--shadow);margin-bottom:13px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel-head h3{font-size:13.5px;margin:0;display:flex;align-items:center;gap:7px}
.panel-head h3 em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-xs);padding:2px 7px}
.panel-head .hint{font-size:11.5px;color:var(--ink-3)}
.panel-head .hint[data-red="1"]{color:var(--ink-2);font-weight:500}

/* 进度 */
.slider-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.slider-head b{font-size:26px;font-weight:700;letter-spacing:-.5px}
.slider-head b small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:1px}
.slider-head span{font-size:11.5px;color:var(--ink-3)}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:2px 0 0}
input[type="range"]::-webkit-slider-runnable-track{height:8px;border-radius:0;background:linear-gradient(90deg,var(--bar) var(--fill,0%),#e3e3dc var(--fill,0%))}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-5px;box-shadow:none}
input[type="range"]::-moz-range-track{height:8px;border-radius:0;background:#e3e3dc}
input[type="range"]::-moz-range-progress{height:8px;border-radius:0;background:var(--bar)}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.slider-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.slider-hint{font-size:11.5px;color:var(--ink-3);margin-top:6px}

/* 列表项 */
.item{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:var(--r-sm);transition:.14s}
.item:hover{background:var(--accent-soft)}
.check{flex:none;margin-top:2px}
.check input{appearance:none;width:16px;height:16px;border:1px solid var(--ink-2);border-radius:var(--r-xs);cursor:pointer;position:relative;transition:.14s;background:#fff}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";position:absolute;left:4.6px;top:1.6px;width:4px;height:8px;border:1.8px solid #fff;border-top:0;border-left:0;transform:rotate(40deg)}
.item-text{flex:1;min-width:0;font-size:13px;line-height:1.55;cursor:pointer;word-break:break-word}
.item-text[data-done="1"]{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.item-side{flex:none;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.item-side time.late{color:var(--red);font-weight:600}
.kill{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:var(--r-xs);opacity:0;transition:.14s}
.item:hover .kill{opacity:1}
.kill:hover{background:var(--red-soft);color:var(--red)}

/* 阻塞 */
.blk{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:0;background:var(--red-soft);border:0;border-left:3px solid var(--red);margin-bottom:8px}
.blk p{flex:1;min-width:0;font-size:13px;line-height:1.5;word-break:break-word}
.blk .bmeta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.blk .bdays{color:var(--red);font-weight:600}
.blk .bico{flex:none;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.blk-resolved{background:#f1f1ea;border-left-color:#c9cbc4}
.blk-resolved p{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.blk-resolved .bico{background:#b6b8b2}
.blk-resolved .bmeta{color:var(--ink-3)}
.addrow{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:11px;flex-wrap:wrap}
.addrow input,.addrow select,.addrow textarea{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:12.5px;padding:0 10px;color:var(--ink);outline:none;transition:.14s}
.addrow input:focus,.addrow select:focus,.addrow textarea:focus{border-color:var(--ink);box-shadow:none}
.addrow textarea{height:auto;min-height:34px;max-height:150px;padding:7px 10px;line-height:1.55;font-family:inherit;resize:vertical}
.addrow input[type="date"]{flex:none;width:136px;padding:0 6px;color:var(--ink-2)}
.addrow .flex1{flex:1;min-width:130px}
.addrow button{flex:none;height:32px;padding:0 13px;border-radius:0;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12.5px;cursor:pointer}
.addrow button:hover{background:#000}

/* 流水 */
.tl{display:flex;flex-direction:column}
.tl-more{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.tl-more .linkbtn{font-size:11.5px}
.tl-row{display:flex;gap:10px;padding:7px 0;position:relative}
.tl-row::before{content:"";position:absolute;left:5px;top:19px;bottom:-2px;width:1px;background:var(--line-2)}
.tl-row:last-child::before{display:none}
.tl-dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px;background:#d8d8d2;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.tl-dot[data-t="progress"]{background:var(--ink)}
.tl-dot[data-t="milestone"]{background:var(--ink-2)}
.tl-dot[data-t="milestone_undo"]{background:#a8a8a0}
.tl-dot[data-t="blocker"]{background:var(--red)}
.tl-dot[data-t="blocker_resolved"]{background:var(--green)}
.tl-dot[data-t="stage"]{background:#6e6e68}
.tl-dot[data-t="created"]{background:#c9cbc4}
.tl-body{flex:1;min-width:0}
.tl-body p{font-size:12.5px;line-height:1.5;color:var(--ink-2);word-break:break-word}
.tl-body p[data-strong="1"]{color:var(--ink);font-weight:600}
.tl-body time{font-size:11px;color:var(--ink-3)}

/* 想法 */
.idea{padding:9px 11px;border:1px solid var(--line);border-radius:0;background:#fff;margin-bottom:7px}
.idea p{font-size:12.5px;line-height:1.55;color:var(--ink-2);word-break:break-word}
.idea-foot{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--ink-3)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:var(--r-pill);font-weight:600}
.tag[data-t="待评估"]{background:var(--accent-soft);color:var(--ink-2)}
.tag[data-t="已采纳"]{background:var(--accent-soft);color:var(--green)}
.tag[data-t="暂缓"]{background:var(--amber-soft);color:var(--amber)}

/* ---------- 想法池（跨项目） ---------- */
.inbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 13px;box-shadow:var(--shadow);margin:16px 0 4px}
.inbox .panel-head{margin-bottom:9px}
.inbox-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.inbox-item{border:1px solid var(--line);border-radius:0;background:#fff;padding:10px 12px}
.inbox-item p{font-size:12.5px;line-height:1.55;color:var(--ink-2);word-break:break-word}
.inbox-foot{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.inbox-foot time{font-size:11px}
.inbox-foot .linkbtn{font-size:11px}

/* ---------- 周报 ---------- */
.report-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:13px 16px;box-shadow:none;margin:22px 0 12px;max-width:820px}
.report-bar .range{font-size:12.5px;color:var(--ink-2)}
.report-bar .range b{color:var(--ink);font-weight:650}
.report-bar .spacer{margin-left:auto}
.report-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:12px;padding:0 2px;max-width:820px}
.report-stats b{color:var(--ink);font-weight:650}
.mdbox{
  background:#fff;border:1px solid var(--line);border-radius:0;padding:22px 24px;box-shadow:none;
  max-width:820px;
  font-family:inherit;
  font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-word;color:var(--ink);
}
.mdbox .h1{font-weight:700;color:var(--ink);font-size:14px}
.mdbox .h2{font-weight:700;color:var(--ink);font-size:13px}
.mdbox .bul{color:var(--ink-2)}
.mdbox .dim{color:var(--ink-3)}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.42);display:grid;place-items:center;padding:24px;animation:fade .16s ease}
.modal{width:min(560px,100%);background:#fff;border:1px solid var(--rule);border-radius:0;padding:22px;box-shadow:none;max-height:88vh;overflow:auto}
.modal h2{font-size:17px;margin:0 0 3px}
.modal .sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field label i{font-style:normal;color:var(--ink-3);font-weight:400}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:13.5px;padding:8px 10px;color:var(--ink);outline:none;transition:.14s;width:100%}
.field textarea{resize:vertical;min-height:64px;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:none}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}

/* ---------- 页脚 / 提示 ---------- */
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 38px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.fstatwrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.fstat{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);max-width:100%}
.fstat .fdot{width:7px;height:7px;border-radius:50%;background:#c9c9c2;flex:none}
.fstat b{font-weight:600;color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fstat[data-tone="ok"]{color:var(--green)}
.fstat[data-tone="ok"] .fdot{background:var(--green)}
.fstat[data-tone="bad"]{color:var(--red)}
.fstat[data-tone="bad"] .fdot{background:var(--red)}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,12px);z-index:90;
  background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:0;
  opacity:0;transition:.2s;pointer-events:none;box-shadow:none;
}
.toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}
.toast[data-undo="1"]{pointer-events:auto}
.toast .undo{border:0;border-left:1px solid rgba(255,255,255,.38);background:none;color:#fff;
  font:inherit;margin-left:12px;padding:0 0 0 12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.toast .undo:hover{opacity:.82}
.toast .undo:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- 搁置说明 ---------- */
.shelvenote{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r-md);padding:7px 10px}
.shelvenote b{color:var(--ink);font-weight:700}
.shelvenote .linkbtn{font-size:11.5px;margin-left:auto}

/* ---------- 置顶标 ---------- */
.pintag{font-size:11px;padding:2px 7px;border-radius:0;background:var(--accent-soft);color:var(--ink);font-weight:600;flex:none}

/* ---------- 跨项目流水 ---------- */
.stream-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:4px}
.stream-sum{font-size:12.5px;color:var(--ink-3)}
.stream-sum b{color:var(--ink);font-weight:650}
.st-day{margin-top:18px}
.st-day h4{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.2px}
.st-day h4 span{color:var(--ink-3);font-weight:400}
.st-day h4::after{content:'';flex:1;height:1px;background:var(--line)}
.st-row{display:flex;align-items:flex-start;gap:10px;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 2px;margin-bottom:0}
.st-time{flex:none;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:3px;width:34px}
.st-body{flex:1;min-width:0}
.st-body p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.st-body p[data-strong="1"]{color:var(--ink);font-weight:600}
.st-proj{font-size:11.5px;margin-top:3px;color:var(--ink-2)}

/* ---------- 顶部提示条（多窗口冲突 / 久未备份） ---------- */
.tipline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-radius:0;padding:9px 13px;margin:14px 0 0;
  font-size:12.5px;line-height:1.5;background:var(--amber-soft);border:1px solid var(--amber);border-left:3px solid var(--amber);color:#6f520a;box-shadow:none}
.tipline .ico{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--amber);color:var(--amber);display:grid;place-items:center;font-size:12px;flex:none}
.tipline b{color:#5f4409;font-weight:650}
.tipline .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tipline .acts button{background:#fff;border:1px solid var(--amber);color:#6f520a;font-size:12px;padding:4px 10px;border-radius:var(--r-sm);cursor:pointer}
.tipline .acts button:hover{background:#fff}
.tipline .acts button[data-primary]{background:var(--ink);border-color:var(--ink);color:#fff}
.tipline .acts button[data-primary]:hover{background:#000}
.bchip{font-size:11px;padding:2px 8px;border-radius:0;background:var(--accent-soft);color:var(--ink-3);white-space:nowrap}
.bchip[data-stale="1"]{background:var(--amber-soft);color:var(--amber);font-weight:600}
/* 打印页眉：屏幕上不占位，只在纸上出现一行「项目工作台 + 日期 + 项目数」 */
.print-head{display:none}
/* 系统开了「减少动态效果」就全部停掉，动画不影响信息 */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
.pref select{margin-top:8px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;font-size:12.5px;padding:0 8px;color:var(--ink)}

/* ---------- 打印 / 存 PDF ---------- */
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important}
  .topbar,.filters,.report-bar,.foot,.inbox,.toast,#modalRoot,.backbar,.archbar,.stream-bar,.tipline{display:none!important}
  .wrap{padding:0;max-width:none}
  .alertbar{background:#fff!important;border:1px solid #e30613;border-left:3px solid #e30613;box-shadow:none;margin:0 0 10px}
  .alertbar .pill{border:1px solid #ddd;background:none;padding:0 6px;color:#8a121c;font-weight:600;cursor:default}
  .alertbar .pill em{color:#e30613}
  .report-stats{display:none!important}
  .print-head{display:flex!important;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid #111;padding-bottom:5px;margin-bottom:12px;font-size:11px;color:#111}
  .print-head:empty{display:none!important}
  .summary{border:0;border-top:2px solid #111;border-bottom:1px solid #ddd;box-shadow:none;margin:0 0 10px;padding:8px 0;page-break-inside:avoid}
  .sum .v{color:#000!important}
  /* 打印走「纸面清单」：双列、无阴影、左边一条健康度色条 */
  .wall{display:grid!important;grid-template-columns:1fr 1fr!important;gap:0 26px!important}
  .card{
    display:block!important;break-inside:avoid;page-break-inside:avoid;box-shadow:none!important;background:#fff!important;
    border:0!important;border-left:3px solid #cfcfc8!important;border-radius:0!important;
    border-bottom:1px solid #e2e2dc!important;padding:9px 0 10px 10px!important;
  }
  .card[data-h="risk"]{border-left-color:#e30613!important}
  .card[data-h="watch"]{border-left-color:#b8860b!important}
  .card[data-h="good"]{border-left-color:#00694c!important}
  .card[data-h="shelved"]{border-left-color:#c9cbc4!important;opacity:1!important}
  .card .card-foot{border-top:0!important;margin-top:4px!important;padding-top:0!important;font-size:11.5px!important}
  .card .card-acts{display:none!important}   /* 纸上不印按钮 */
  .card .nextline em{display:inline!important}
  .card:hover{transform:none;box-shadow:none}
  .mdbox{border:0!important;box-shadow:none!important;padding:0!important;font-size:11px;line-height:1.58;orphans:2;widows:2;max-width:none!important}
  .report-bar,.report-stats{max-width:none!important}
  .mdbox .h1{font-size:14px}
  .mdbox .h2{font-size:12.5px}
  a{color:inherit!important;text-decoration:none}
}

/* ---------- 手机 / 窄屏 ---------- */
@media (max-width:640px){
  .wrap{padding:0 12px}
  .topbar-inner{height:56px;gap:6px}
  .brand{flex:none}
  .brand b{font-size:14px;white-space:nowrap}
  .brand i{display:none}
  .logo{width:30px;height:30px;border-radius:var(--r-sm);font-size:13px}
  .nav{flex:none}
  .nav a{padding:5px 8px;font-size:12px;white-space:nowrap}
  .topbar-inner .btn-sm{height:30px;padding:0 9px;font-size:11.5px;white-space:nowrap}
  .summary{margin:12px 0 10px;padding:9px 0}
  .sum{flex:1 1 50%;padding:7px 12px}
  .sum .v{font-size:19px}
  .filters{padding:10px 11px}
  .frow{gap:8px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap}
  .searchbox{flex:1 1 100%}
  .wall{grid-template-columns:1fr;gap:11px}
  .card{padding:13px 13px 11px}
  /* 手指比鼠标粗：卡片上的编辑/删除放到 34px 高，两个之间留出距离 */
  .card-acts{gap:10px}
  .card-acts .btn{height:34px;padding:0 13px;font-size:12.5px;border-color:var(--line)}
  .d-head{padding:11px 13px 9px}
  .d-top h2{font-size:17px}
  .drawer-scroll{padding:12px 12px 26px}
  .panel{padding:13px 13px 11px}
  .inbox{padding:12px 12px 10px}
  .inbox-list{grid-template-columns:1fr}
  .foot{gap:8px;font-size:11.5px}
  .foot .spacer{display:none}
  .report-bar{padding:11px 12px}
  .report-bar .spacer{display:none}
  .report-stats{gap:10px}
  .modal-mask{padding:10px}
  .modal{width:100%;padding:17px;max-height:92vh}
  .field-row{grid-template-columns:1fr}
  .mdbox{padding:13px 12px;font-size:12.5px}
}
/* 再窄一点：顶栏一行放不下，让导航落到第二行，别把「新建」挤出去 */
@media (max-width:480px){
  .topbar-inner{height:auto;min-height:56px;flex-wrap:wrap;padding-top:7px;padding-bottom:7px;row-gap:6px}
  .topbar-inner .brand{flex:1 1 auto;min-width:0}
  .topbar-inner .nav{order:4;flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start}
}
@media (max-width:400px){
  .sum{flex:1 1 50%}
  .sum .v{font-size:18px}
  .sum .k{font-size:10.5px}
  .nav a{padding:5px 5px;font-size:11px}
  .brand b{display:block;font-size:11.5px}
  .only-wide{display:none}
  .only-narrow{display:inline}
  .topbar-inner{gap:5px}
  .brand b{font-size:12px}
  .topbar-inner .btn-sm{padding:0 7px;font-size:11px}
  .topbar-inner .btn{padding:0 10px;font-size:12px}
  .chips{flex-wrap:wrap;overflow-x:visible;padding-bottom:0;row-gap:5px}
  /* 最窄屏：添加行让输入占满一行，别把输入框压到看不清占位提示 */
  /* 只有「带日期框」的添加行（里程碑 / 阻塞）才整行铺开：它们本来就要两行 */
  .addrow:has(input[type="date"]) .flex1{flex:1 1 100%}
  .addrow input[type="date"]{flex:1 1 auto;width:auto;min-width:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <span class="logo">项</span>
      <span>
        <b>项目工作台</b>
        <i>进度 · 阻塞 · 到期</i>
      </span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-page="overview">总览</a>
      <a href="#/stream" data-page="stream">流水</a>
      <a href="#/report" data-page="report">周报</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" data-act="settings">设置</button>
    <button class="btn btn-primary" data-act="new"><span class="only-wide">新建项目</span><span class="only-narrow">新建</span></button>
  </div>
</header>

<div class="wrap" id="syncBar"></div>
<div id="printHead" class="print-head"></div>

<main id="app" class="wrap"></main>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   一、数据模型（localStorage / pw_v3）—— health 不在模型里，全部实时推导
   ------------------------------------------------------------------
   Project {
     id, name, stage, progress(0-100), due('YYYY-MM-DD'), next, link, desc,
     createdAt, updatedAt,
     milestones:[{id,title,date,done,doneAt}],
     blockers:[{id,text,start,resolvedAt|null}],
     events:[{id,at,type,text,from?,to?}],
     ideas:[{id,text,tag,at}]
   }
   ================================================================== */
var KEY = 'pw_v3';
var VERSION = 3;
var STAGES = ['立项', '设计', '开发', '测试', '上线', '复盘'];
var IDEA_TAGS = ['待评估', '已采纳', '暂缓'];
var IDLE_DAYS = 7;        // 进度停滞阈值（天）
var SOON_DAYS = 3;        // 临近到期阈值（天）
var LOW_PROGRESS = 80;    // 临近到期时视为「来不及」的进度线
var EV_SHOW = 60;         // 抽屉里一次只铺最近这么多条流水，再早就去流水页看

var state = { version: VERSION, projects: [], inbox: [] };

/* ---------- 基础工具 ---------- */
function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
/* 外部导入的 id 只留安全字符，否则会破坏 HTML 属性 */
function safeId(x) {
  return (typeof x === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(x)) ? x : uid();
}
/* 外链只允许 http(s)/mailto；裸域名补 https，脚本类协议直接丢掉 */
function normalizeLink(s) {
  var v = String(s == null ? '' : s).trim().slice(0, 400);
  if (!v) return '';
  if (/^(https?:|mailto:)/i.test(v)) return v;
  if (/^(javascript|data|vbscript|file|blob):/i.test(v)) return '';
  if (/^\/\//.test(v)) return 'https:' + v;
  if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v)) return 'https://' + v;
  return '';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function dateISO(d) {
  var x = new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function todayISO() { return dateISO(new Date()); }
function shiftISO(days) { var d = new Date(); d.setDate(d.getDate() + days); return dateISO(d); }
function shiftStamp(days, hh, mm) {
  var d = new Date();
  d.setDate(d.getDate() + (days || 0));
  d.setHours(hh == null ? 10 : hh, mm == null ? 0 : mm, 0, 0);
  return d.toISOString();
}
function md(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p[1] + '.' + p[2]; }
function mdy(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function dayDiff(iso) {
  if (!iso) return null;
  var t = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  var n = new Date(); n.setHours(0, 0, 0, 0);
  if (isNaN(t.getTime())) return null;          /* 日期本身解析不了就别算出 NaN 天 */
  return Math.round((t - n) / 86400000);
}
/* 「2026-13-45」「2026-02-30」这种格式对、日子不存在的日期要挡掉：
   Date 会把它们滚到下个月，光判 NaN 是抓不到的 */
function isRealDate(iso) {
  if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  var y = parseInt(iso.slice(0, 4), 10), m = parseInt(iso.slice(5, 7), 10), d = parseInt(iso.slice(8, 10), 10);
  var dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function stampShort(isoDt) {
  if (!isoDt) return '';
  var d = new Date(isoDt);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (diff <= 0) return '今天 ' + hm;
  if (diff === 1) return '昨天 ' + hm;
  return md(isoDt) + ' ' + hm;
}
function weekStart() {
  var d = new Date(); d.setHours(0, 0, 0, 0);
  var wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return d;
}
function inThisWeek(isoDt) { return isoDt ? new Date(isoDt) >= weekStart() : false; }

/* ==================================================================
   二、持久化（空 / 损坏 / 被清空都不报错）
   ================================================================== */
function isObj(x) { return x && typeof x === 'object'; }
function normalizeIdea(raw) {
  var i = isObj(raw) ? raw : {};
  return {
    id: safeId(i.id),
    text: String(i.text || '').slice(0, 200),
    tag: IDEA_TAGS.indexOf(i.tag) > -1 ? i.tag : '待评估',
    at: i.at || todayISO()
  };
}
function normalizeInboxItem(raw) { return normalizeIdea(raw); }

function normalizeProject(raw) {
  var p = isObj(raw) ? raw : {};
  var prog = parseInt(p.progress, 10);
  prog = isFinite(prog) ? Math.max(0, Math.min(100, prog)) : 0;
  var now = new Date().toISOString();
  return {
    id: safeId(p.id),
    name: String(p.name || '未命名项目').slice(0, 60),
    stage: STAGES.indexOf(p.stage) > -1 ? p.stage : '立项',
    progress: prog,
    due: isRealDate(p.due) ? p.due : '',
    next: String(p.next || '').slice(0, 120),
    link: normalizeLink(p.link),
    desc: String(p.desc || '').slice(0, 400),
    shelved: !!p.shelved,
    shelvedAt: p.shelvedAt || null,
    shelveReason: String(p.shelveReason || '').slice(0, 60),
    pinned: !!p.pinned,
    createdAt: p.createdAt || p.updatedAt || now,
    updatedAt: p.updatedAt || now,
    milestones: Array.isArray(p.milestones) ? p.milestones.filter(isObj).map(function (m) {
      return {
        id: safeId(m.id), title: String(m.title || '').slice(0, 120),
        date: isRealDate(m.date) ? m.date : '',
        done: !!m.done, doneAt: m.doneAt || null
      };
    }) : [],
    blockers: Array.isArray(p.blockers) ? p.blockers.filter(isObj).map(function (b) {
      return {
        id: safeId(b.id), text: String(b.text || '').slice(0, 160),
        start: isRealDate(b.start) ? b.start : todayISO(),
        resolvedAt: b.resolvedAt || null
      };
    }) : [],
    events: Array.isArray(p.events) ? p.events.filter(isObj).map(function (e) {
      return {
        id: safeId(e.id), at: e.at || now, type: String(e.type || 'note'),
        text: String(e.text || ''), from: (e.from == null ? null : e.from), to: (e.to == null ? null : e.to)
      };
    }) : [],
    ideas: Array.isArray(p.ideas) ? p.ideas.filter(isObj).map(function (i) {
      return {
        id: safeId(i.id), text: String(i.text || '').slice(0, 200),
        tag: IDEA_TAGS.indexOf(i.tag) > -1 ? i.tag : '待评估', at: i.at || todayISO()
      };
    }) : []
  };
}
/* 手工改过的备份里 id 可能重复：同一个 id 会让抽屉打开另一个项目、还改坏它 */
function healIds(st) {
  var seenP = {};
  (st.projects || []).forEach(function (p) {
    if (!p) return;
    if (seenP[p.id]) p.id = uid();
    seenP[p.id] = 1;
    ['milestones', 'blockers', 'events', 'ideas'].forEach(function (k) {
      var seen = {};
      (p[k] || []).forEach(function (x) {
        if (!x) return;
        if (seen[x.id]) x.id = uid();
        seen[x.id] = 1;
      });
    });
  });
  var seenI = {};
  (st.inbox || []).forEach(function (i) {
    if (!i) return;
    if (seenI[i.id]) i.id = uid();
    seenI[i.id] = 1;
  });
  return st;
}
function loadState() {
  var blank = { version: VERSION, projects: [], inbox: [] };
  var raw;
  try { raw = localStorage.getItem(KEY); } catch (e) { return blank; }
  if (!raw) return blank;
  try {
    var o = JSON.parse(raw);
    var arr = Array.isArray(o) ? o : (isObj(o) && Array.isArray(o.projects) ? o.projects : null);
    if (!arr) return blank;
    return healIds({
      version: VERSION,
      projects: arr.filter(isObj).map(normalizeProject),
      inbox: (isObj(o) && Array.isArray(o.inbox)) ? o.inbox.filter(isObj).map(normalizeInboxItem) : []
    });
  } catch (e) { return blank; }
}
function save() {
  if (externalPending) {
    var overwrite = confirm('另一个窗口刚改过这份数据。\n\n确定：用这个窗口的内容覆盖过去（对方的改动会丢）\n取消：改为载入对方的版本（这里未保存的改动会丢）');
    if (!overwrite) { reloadFromStore(); return false; }
    externalPending = false;
  }
  try {
    var text = JSON.stringify({ version: VERSION, projects: state.projects, inbox: state.inbox || [] });
    localStorage.setItem(KEY, text);
    lastSavedText = text;
  }
  catch (e) { toast('保存失败：浏览器存储不可用，请先导出备份'); return false; }
  updateSyncBar();
  scheduleFileWrite();
  scheduleSnapshot();
  return true;
}

/* ---------- 多窗口同时改同一份数据（后保存的别把先保存的盖掉） ---------- */
var externalPending = false;
var lastSavedText = null;
function syncBarHtml() {
  if (!externalPending) return '';
  return '<div class="tipline" data-tone="warn"><span class="ico">!</span>' +
    '<span><b>另一个窗口改过这份数据。</b>别在这个窗口继续改，先选一边——载入对方会放弃这里未保存的改动；保留这份，下次保存会覆盖对方。</span>' +
    '<span class="acts"><button data-act="sync-reload" data-primary>载入对方的</button>' +
    '<button data-act="sync-dismiss">保留这份</button></span></div>';
}
function updateSyncBar() {
  var el = document.getElementById('syncBar');
  if (el) el.innerHTML = syncBarHtml();
}
function reloadFromStore() {
  state = loadState();
  try { lastSavedText = localStorage.getItem(KEY); } catch (e) {}
  externalPending = false;
  if (ui.openId && !find(ui.openId)) closeDrawer();
  updateSyncBar();
  render();
  toast('已载入另一个窗口的版本');
}
window.addEventListener('storage', function (e) {
  if (e.key !== KEY) return;
  if (lastSavedText != null && e.newValue === lastSavedText) return;
  externalPending = true;
  updateSyncBar();
});

/* ---------- 很久没备份时的提醒 ---------- */
var SAVE_KEY = 'pw_saved';
function readSavedAt() { try { return localStorage.getItem(SAVE_KEY) || ''; } catch (e) { return ''; } }
function markSaved() { try { localStorage.setItem(SAVE_KEY, new Date().toISOString()); } catch (e) {} }
function backupDays() {
  var s = readSavedAt();
  if (!s) return null;
  var t = new Date(s);
  if (isNaN(t.getTime())) return null;
  var a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  var n = new Date(); n.setHours(0, 0, 0, 0);
  var diff = Math.round((n - a) / 86400000);   /* 按日历天算：今天备份过 = 0 */
  return diff > 0 ? diff : 0;                  /* 时间被改到过去时按今天算 */
}
function backupBarHtml() {
  var limit = prefs.remindDays;
  if (!limit || !state.projects.length) return '';
  var days = backupDays();
  if (days !== null && days < limit) return '';
  var txt = days === null
    ? '还没把数据存成文件。清缓存、换浏览器、换电脑，这份工作台就没了。'
    : '已经 <b>' + days + '</b> 天没备份文件了。清缓存或换电脑就找不回来。';
  return '<div class="tipline"><span class="ico">!</span><span>' + txt + '</span>' +
    '<span class="acts"><button data-act="save-as" data-primary>保存到文件</button>' +
    '<button data-act="' + (dirBlocked ? 'backup-download' : 'choose-dir') + '">' + (dirBlocked ? '下载备份' : '设置备份') + '</button></span></div>';
}
function backupChipHtml() {
  if (!prefs.remindDays || !state.projects.length) return '';
  var days = backupDays();
  if (days === null) return '<span class="bchip" data-stale="1">还没备份过文件</span>';
  if (days >= prefs.remindDays) return '<span class="bchip" data-stale="1">' + days + ' 天没备份</span>';
  return '<span class="bchip">' + (days === 0 ? '今天备份过' : days + ' 天前备份过') + '</span>';
}

/* ==================================================================
   三、派生数据（全部实时算，不落库、不硬编码）
   ================================================================== */
function find(id) { return state.projects.filter(function (p) { return p.id === id; })[0]; }
function activeBlockers(p) { return (p.blockers || []).filter(function (b) { return !b.resolvedAt; }); }
function doneMilestones(p) { return (p.milestones || []).filter(function (m) { return m.done; }); }

function dueInfo(p) {
  if (p.progress >= 100) return { label: '已交付', state: 'done', days: null };
  if (p.shelved) return { label: '搁置中', state: 'shelved', days: null };
  if (!p.due) return { label: '未设目标日期', state: 'none', days: null };
  var d = dayDiff(p.due);
  if (d < 0) return { label: '逾期 ' + (-d) + ' 天', state: 'late', days: d };
  if (d === 0) return { label: '今天到期', state: 'today', days: 0 };
  return { label: '还剩 ' + d + ' 天', state: d <= SOON_DAYS ? 'soon' : 'normal', days: d };
}

/* 最后一次进度变动时间（没有进度流水则退回创建时间） */
function lastProgressAt(p) {
  var evs = (p.events || []).filter(function (e) { return e.type === 'progress' && e.at; });
  if (!evs.length) return p.createdAt || p.updatedAt || new Date().toISOString();
  return evs.reduce(function (acc, e) { return e.at > acc ? e.at : acc; }, evs[0].at);
}
/* 按日历天算「多久没动」：今天动过 = 0，昨天 = 1，跨了 7 个日历天就是 7 */
function daysSinceStamp(stamp) {
  var d = new Date(stamp);
  if (isNaN(d.getTime())) return 0;
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var n = new Date(); n.setHours(0, 0, 0, 0);
  var diff = Math.round((n - t) / 86400000);
  return diff > 0 ? diff : 0;
}
function idleDays(p) { return daysSinceStamp(lastProgressAt(p)); }

/* 健康度：红 / 黄 / 绿 —— 规则唯一来源，界面不提供手填 */
function healthOf(p) {
  if (p.shelved && p.progress < 100) return { level: 'shelved', label: '灰', name: '搁置', reason: '已搁置，不算风险也不算停滞' };
  /* 已交付的排在阻塞判断之前：交付后残留的旧阻塞不该继续报红，否则卡片和汇总数字对不上 */
  if (p.progress >= 100) return { level: 'good', label: '绿', name: '健康', reason: '已交付' };
  var ab = activeBlockers(p).length;
  if (ab > 0) return { level: 'risk', label: '红', name: '有风险', reason: ab + ' 个未解决阻塞' };
  if (p.due) {
    var d = dayDiff(p.due);
    if (d !== null && d <= SOON_DAYS && p.progress < LOW_PROGRESS) {
      var when = d < 0 ? '已逾期 ' + (-d) + ' 天' : (d === 0 ? '今天到期' : '距到期 ' + d + ' 天');
      return { level: 'watch', label: '黄', name: '需关注', reason: when + '，进度 ' + p.progress + '%' };
    }
  }
  var idle = idleDays(p);
  if (idle >= IDLE_DAYS) return { level: 'watch', label: '黄', name: '需关注', reason: '进度已 ' + idle + ' 天没动' };
  return { level: 'good', label: '绿', name: '健康', reason: '正常推进' };
}

function summary() {
  var all = state.projects;
  var total = all.length;
  var activeList = all.filter(function (p) { return p.progress < 100 && !p.shelved; });
  var active = activeList.length;
  var blocked = activeList.filter(function (p) { return activeBlockers(p).length > 0; }).length;
  var weekDue = all.filter(dueThisWeek).length;
  var avg = activeList.length
    ? Math.round(activeList.reduce(function (s, p) { return s + p.progress; }, 0) / activeList.length)
    : null;   /* 没有进行中的项目时，「平均进度」不该显示成 0% */
  var shelved = all.filter(function (p) { return p.shelved && p.progress < 100; }).length;
  return { total: total, active: active, blocked: blocked, weekDue: weekDue, avg: avg, shelved: shelved };
}
function dueThisWeek(p) {
  if (!p.due || p.progress >= 100 || p.shelved) return false;
  var ws = weekStart();
  var we = new Date(ws.getTime());
  we.setDate(we.getDate() + 6);       /* 用 setDate 加天，别用 86400000 毫秒硬加（跨夏令时会差一天） */
  return p.due >= dateISO(ws) && p.due <= dateISO(we);
}
/* 需要今天处理：逾期 / 今天到期 / 3 天内且进度低 */
function needsAttention() {
  return state.projects.filter(function (p) {
    if (p.shelved) return false;
    var due = dueInfo(p);
    if (due.state === 'late' || due.state === 'today') return true;
    return due.days !== null && due.days >= 0 && due.days <= SOON_DAYS && p.progress < LOW_PROGRESS;
  }).sort(byDueAsc);
}

/* ==================================================================
   四、视图状态与筛选
   ================================================================== */
var ui = { stage: 'all', health: 'all', due: 'all', q: '', openId: null, showDelivered: false, dismissedBack: false, range: '7d' };
/* 换一批项目（清空 / 载入示例）时把筛选归位，否则会「明明载入了却一片空白」 */
function resetFilters() { ui.stage = 'all'; ui.health = 'all'; ui.due = 'all'; ui.q = ''; }

/* 界面偏好（只影响显示哪几个按钮，和数据无关，不参与导入导出） */
var PREFS_KEY = 'pw_ui_v1';
var prefs = { showRegen: false, reportDownload: false, footExport: false, remindDays: 14, author: '' };
(function loadPrefs() {
  try {
    var o = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    if (isObj(o)) ['showRegen', 'reportDownload', 'footExport'].forEach(function (k) {
      if (k in o) prefs[k] = !!o[k];
    });
    if (isObj(o) && typeof o.author === 'string') prefs.author = o.author.slice(0, 24);
    if (isObj(o) && 'remindDays' in o) {
      var n = parseInt(o.remindDays, 10);
      prefs.remindDays = isFinite(n) && n > 0 ? n : 0;
    }
  } catch (e) {}
})();
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
}
/* 署名：留空或只有空格都当作没填 */
function authorName() { return String(prefs.author || '').trim(); }

/* 搜索：项目名 / 下一个动作 / 简介 / 阻塞 / 里程碑 / 想法，空格分词为 AND */
function matchesQuery(p, q) {
  q = String(q || '').trim();
  if (!q) return true;
  var hay = [p.name, p.next, p.desc, p.stage, p.link]
    .concat((p.blockers || []).map(function (b) { return b.text; }))
    .concat((p.milestones || []).map(function (m) { return m.title; }))
    .concat((p.ideas || []).map(function (i) { return i.text; }))
    .join(' \n ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (k) { return hay.indexOf(k) > -1; });
}

function sortKey(p) {
  if (p.progress >= 100) return 3;
  var lv = healthOf(p).level;
  if (lv === 'risk') return 0;
  if (lv === 'watch') return 1;
  if (lv === 'shelved') return 4;
  return 2;
}
function filtered() {
  return state.projects.filter(function (p) {
    if (!matchesQuery(p, ui.q)) return false;
    if (ui.stage !== 'all' && p.stage !== ui.stage) return false;
    if (ui.health !== 'all' && healthOf(p).level !== ui.health) return false;
    var due = dueInfo(p);
    if (ui.due === 'late' && due.state !== 'late') return false;
    if (ui.due === 'week' && !dueThisWeek(p)) return false;
    return true;
  }).sort(function (a, b) {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    var ka = sortKey(a), kb = sortKey(b);
    if (ka !== kb) return ka - kb;
    var x = a.due || '9999', y = b.due || '9999';
    return x < y ? -1 : x > y ? 1 : 0;
  });
}

/* ==================================================================
   五、总览
   ================================================================== */
/* 隔几天回来时的一句交代 */
var VISIT_KEY = 'pw_visit';
var backInfo = null;
function readVisit() { try { return localStorage.getItem(VISIT_KEY) || ''; } catch (e) { return ''; } }
function writeVisit() { try { localStorage.setItem(VISIT_KEY, new Date().toISOString()); } catch (e) {} }
function computeBackInfo() {
  var last = readVisit();
  if (!last) return null;
  var t = new Date(last);
  if (isNaN(t.getTime())) return null;
  var ms = Date.now() - t.getTime();
  if (!isFinite(ms) || ms <= 0) return null;
  /* 跟「多久没动」同口径：按日历天数，不按 24 小时硬算（否则昨晚 23 点看到今早 8 点会算成 0 天） */
  var days = Math.max(1, daysSinceStamp(last));
  if (days < 2) return null;
  var events = 0, ids = {};
  state.projects.forEach(function (p) {
    (p.events || []).forEach(function (e) {
      if (e.at && e.at >= last) { events++; ids[p.id] = 1; }
    });
  });
  var late = state.projects.filter(function (p) { return dueInfo(p).state === 'late'; }).length;
  var soon = state.projects.filter(function (p) {
    if (p.progress >= 100 || p.shelved) return false;
    var d = dayDiff(p.due);
    return d !== null && d >= 0 && d <= SOON_DAYS && p.progress < LOW_PROGRESS;
  }).length;
  return { days: days, events: events, projects: Object.keys(ids).length, late: late, soon: soon };
}
function backBannerHtml() {

  if (tail.length) parts.push('眼下 ' + tail.join('、'));
  return '<div class="backbar"><span class="ico">↺</span>' +
    '<span>你上次看是 <b>' + b.days + '</b> 天前 · ' + parts.join('；') + '</span>' +
    '<button class="linkbtn" data-act="dismiss-back" style="margin-left:auto">知道了</button></div>';
}

/* 卡片墙 / 空结果（搜索和筛选共用这一块，便于局部刷新） */
function deliveredAt(p) {
  var evs = (p.events || []).filter(function (e) { return e.type === 'progress' && e.to === 100 && e.at; });
  if (evs.length) return evs.reduce(function (a, e) { return e.at > a ? e.at : a; }, evs[0].at);
  if (p.progress >= 100) return lastProgressAt(p);
  return null;
}
/* 交付满 30 天收进折叠层，卡片墙只留还在跑的 */
function isArchived(p) {
  if (p.progress < 100) return false;
  var at = deliveredAt(p);
  if (!at) return false;
  return dayDiff(at) <= -(ARCHIVE_DAYS);
}
function wallInner(list) {

  list.forEach(function (p) { (isArchived(p) && !searching ? arch : main).push(p); });
  var html = '<div class="wall">' + main.map(card).join('') + '</div>';

}

function weekdayCN(iso) {

  return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
}
function clockOf(at) {
  var d = new Date(at);
  if (isNaN(d.getTime())) return '';
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function streamSince() {
  var d = new Date();
  if (ui.range === 'today') { d.setHours(0, 0, 0, 0); return d; }
  if (ui.range === 'week') return weekStart();
  if (ui.range === '7d') { d.setDate(d.getDate() - 6); d.setHours(0, 0, 0, 0); return d; }
  return null;
}
function streamRows() {
  var since = streamSince();

    (p.events || []).forEach(function (e) {

      if (since && d < since) return;
      rows.push({ p: p, e: e, day: dateISO(d) });

  rows.sort(function (a, b) { return a.e.at < b.e.at ? 1 : -1; });
  return rows;
}

/* 「多久没动」：口径与健康度一致，取最近一次进度变动；已交付看交付天数，搁置的不再提示 */
function idleInfo(p) {
  if (p.shelved && p.progress < 100) return { text: '', stale: false };
  if (p.progress >= 100) {
    var at = deliveredAt(p);
    if (!at) return { text: '', stale: false };
    var n = -dayDiff(at);
    return { text: n <= 0 ? '今天交付' : '交付 ' + n + ' 天', stale: false };
  }
  var d = idleDays(p);
  if (d <= 0) return { text: '今天动过', stale: false };
  if (d === 1) return { text: '昨天动过', stale: false };
  return { text: d + ' 天没动', stale: d >= IDLE_DAYS };
}

/* ==================================================================
   六、周报（本周有变更才出现）
   ================================================================== */
function buildReport() {
  var ws = weekStart();
  var now = new Date();
  var per = [];
  var eventsTotal = 0;
  var blockedTotal = state.projects.filter(function (p) { return p.progress < 100 && !p.shelved && activeBlockers(p).length > 0; }).length;
  var overdueTotal = state.projects.filter(function (p) { return dueInfo(p).state === 'late'; }).length;

  state.projects.forEach(function (p) {
    var evs = (p.events || []).filter(function (e) { return inThisWeek(e.at); });
    if (!evs.length) return;
    eventsTotal += evs.length;
    var progEvs = evs.filter(function (e) { return e.type === 'progress'; })
      .sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    var delta = 0;
    if (progEvs.length) {
      var first = progEvs[0], last = progEvs[progEvs.length - 1];
      var fromV = first.from != null ? first.from : p.progress;
      var toV = last.to != null ? last.to : p.progress;
      delta = toV - fromV;
    }
    per.push({ p: p, evs: evs.sort(function (a, b) { return a.at < b.at ? -1 : 1; }), delta: delta });
  });

  per.sort(function (a, b) {
    var ka = sortKey(a.p), kb = sortKey(b.p);
    if (ka !== kb) return ka - kb;
    return b.p.progress - a.p.progress;
  });

  /* 下周要盯：未来 7 天（含今天）到期 + 仍在逾期 */
  var upcoming = state.projects.filter(function (p) {
    if (p.progress >= 100 || !p.due || p.shelved) return false;
    var d = dayDiff(p.due);
    return d >= 0 && d <= 7;
  }).sort(byDueAsc);
  var stillLate = state.projects.filter(function (p) {
    return p.progress < 100 && !p.shelved && p.due && dayDiff(p.due) < 0;
  }).sort(byDueAsc);

  /* 一句话摘要：推进最多 / 最卡 / 最急 */
  var topUp = per.filter(function (i) { return i.delta > 0; })
    .sort(function (a, b) { return b.delta - a.delta; })[0];
  var stuck = null;
  state.projects.forEach(function (p) {
    if (p.shelved || p.progress >= 100) return;   /* 交付或搁置的项目不该再当「最卡」 */
    activeBlockers(p).forEach(function (b) {
      var days = b.start ? -dayDiff(b.start) : 0;
      if (!stuck || days > stuck.days) stuck = { name: p.name, days: days };
    });
  });
  var urgent = stillLate[0] || upcoming[0];

  /* 本周完成的里程碑（逐条）与停滞项目 */
  var weekDone = [];
  state.projects.forEach(function (p) {
    (p.milestones || []).forEach(function (m) {
      if (m.done && m.doneAt && inThisWeek(m.doneAt)) weekDone.push({ p: p, m: m });
    });
  });
  weekDone.sort(function (a, b) { return a.m.doneAt < b.m.doneAt ? 1 : -1; });
  var stagnant = state.projects.filter(function (p) {
    return p.progress < 100 && !p.shelved && idleDays(p) >= IDLE_DAYS;
  }).sort(function (a, b) { return idleDays(b) - idleDays(a); });

  var L = [];
  L.push('# 项目周报 · ' + mdy(dateISO(ws)) + ' – ' + mdy(todayISO()));
  L.push('');
  /* 开头这句只说一次，别再单独补一句「所有项目都没有变更记录」——
     有里程碑完成时那样写会跟下面的里程碑清单自相矛盾 */
  if (per.length) {
    L.push('本周 ' + per.length + ' 个项目有变更，共 ' + eventsTotal + ' 条动态。' +
      (state.projects.length - per.length > 0 ? '（另有 ' + (state.projects.length - per.length) + ' 个项目本周无变更，未列出）' : ''));
  } else if (weekDone.length) {
    L.push('本周没有流水记录，' + weekDone.length + ' 个里程碑完成。');
  } else {
    L.push('本周没有任何变更，也没有里程碑完成。');
  }
  L.push('');
  L.push('当前全局：' + blockedTotal + ' 个项目有未解决阻塞，' + overdueTotal + ' 个项目已逾期。');
  L.push('');
  var brief = [];
  if (topUp) brief.push('本周推进最多的是 ' + topUp.p.name + '（+' + topUp.delta + '%）');
  if (stuck && stuck.days > 0) brief.push('最卡的是 ' + stuck.name + '（阻塞 ' + stuck.days + ' 天）');
  if (urgent) brief.push('最急的是 ' + urgent.name + '（' + md(urgent.due) + ' ' + dueInfo(urgent).label + '）');
  if (brief.length) {
    L.push('> ' + brief.join('；') + '。');
    L.push('');
  }
  per.forEach(function (item) {
    var p = item.p;
    var h = healthOf(p);
    var d = dueInfo(p);
    var msAll = (p.milestones || []).length;
    var msDone = doneMilestones(p).length;
    var msWeek = (p.milestones || []).filter(function (m) { return m.done && m.doneAt && inThisWeek(m.doneAt); }).length;

    L.push('## ' + p.name + ' · ' + p.stage + (p.shelved ? ' · 搁置中' : '') + ' · ' + h.label + '（' + h.reason + '）');
    L.push('');
    L.push('- 进度：' + p.progress + '%' + (item.delta ? '（本周 ' + (item.delta > 0 ? '+' : '') + item.delta + '%）' : ''));
    L.push('- 到期：' + (p.due ? md(p.due) + ' · ' : '') + d.label);
    L.push('- 下一个动作：' + (p.next || '未填写'));
    L.push('- 里程碑：' + msDone + '/' + msAll + (msWeek ? '（本周完成 ' + msWeek + ' 个）' : ''));
    if (p.link) L.push('- 外链：' + p.link);

    var act = activeBlockers(p);
    if (act.length) {
      L.push('- 未解决阻塞（' + act.length + '）');
      act.forEach(function (b) {
        var days = b.start ? (-dayDiff(b.start)) : 0;
        L.push('  - ' + b.text + '（开始 ' + md(b.start) + (days > 0 ? '，已阻塞 ' + days + ' 天' : '') + '）');
      });
    }
    var res = (p.blockers || []).filter(function (b) { return b.resolvedAt && inThisWeek(b.resolvedAt); });
    if (res.length) {
      L.push('- 本周解除阻塞（' + res.length + '）');
      res.forEach(function (b) { L.push('  - ' + b.text); });
    }
    L.push('- 本周动态');
    item.evs.forEach(function (e) { L.push('  - ' + md(e.at) + ' ' + e.text); });
    L.push('');
  });

  /* 两段清单：本周完成、停滞 */
  if (weekDone.length) {
    L.push('## 本周完成的里程碑（' + weekDone.length + ' 个）');
    L.push('');
    weekDone.forEach(function (it) {
      L.push('- ' + md(it.m.doneAt) + ' ' + it.p.name + ' · ' + it.m.title);
    });
    L.push('');
  }
  if (stagnant.length) {
    L.push('## 停滞超过 ' + IDLE_DAYS + ' 天（' + stagnant.length + ' 个）');
    L.push('');
    stagnant.forEach(function (p) {
      L.push('- ' + p.name + ' · ' + idleDays(p) + ' 天没动 · ' + p.progress + '% · ' +
        (p.next ? '下一个动作：' + p.next : '下一个动作还没填'));
    });
    L.push('');
  }

  /* 下周要盯放在最末：本周扫完，最后落到下周怎么排 */
  L.push('## 下周要盯' + (upcoming.length ? '（未来 7 天 ' + upcoming.length + ' 个）' : ''));
  L.push('');
  if (!upcoming.length) {
    L.push('- 未来 7 天没有到期的项目。');
  } else {
    upcoming.forEach(function (p) {
      L.push('- ' + md(p.due) + '（' + dueInfo(p).label + '）' + p.name + ' · ' + p.stage + ' · ' + p.progress + '%' +
        (p.next ? ' · 下一个动作：' + p.next : ''));
    });
  }
  if (stillLate.length) {
    L.push('');
    L.push('仍在逾期（' + stillLate.length + '）');
    stillLate.forEach(function (p) {
      L.push('  - ' + p.name + ' · ' + dueInfo(p).label + ' · ' + p.progress + '%' +
        (activeBlockers(p).length ? '（阻塞 ' + activeBlockers(p).length + '）' : ''));
    });
  }
  L.push('');

  L.push('---');
  L.push('生成于 ' + mdy(todayISO()) + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') +
    (authorName() ? ' · ' + authorName() : ''));
  return {
    text: L.join('\n'), count: per.length, events: eventsTotal,
    skipped: state.projects.length - per.length,
    upcoming: upcoming.length, stillLate: stillLate.length,
    weekDone: weekDone.length, stagnant: stagnant.length
  };
}

function byDueAsc(a, b) { var x = a.due || '9999', y = b.due || '9999'; return x < y ? -1 : x > y ? 1 : 0; }

function markdownToHtml(text) {
  return text.split('\n').map(function (line) {
    if (/^# /.test(line)) return '<span class="h1">' + esc(line.slice(2)) + '</span>';
    if (/^## /.test(line)) return '<span class="h2">' + esc(line.slice(3)) + '</span>';
    if (/^- /.test(line)) return '<span class="bul">· </span>' + esc(line.slice(2));
    if (/^  - /.test(line)) return '    <span class="bul">· </span>' + esc(line.slice(4));
    if (/^> /.test(line)) return '<span class="dim">' + esc(line.slice(2)) + '</span>';
    if (/^---$/.test(line)) return '<span class="dim">──────────</span>';
    return esc(line);
  }).join('\n');
}

  var r = buildReport();

      '<span class="spacer"></span>' +
      (prefs.showRegen ? '<button class="btn btn-sm" data-act="report-regen">重新生成</button>' : '') +
      '<button class="btn btn-sm" data-act="print" title="浏览器打印，选「另存为 PDF」即可导出">打印 / 存 PDF</button>' +
      '<button class="btn btn-sm btn-primary" data-act="report-copy">复制 Markdown</button>' +
      '<button class="btn btn-sm" data-act="save-report">' + (dirHandle ? '存到文件夹' : '保存 .md') + '</button>' +
      (prefs.reportDownload ? '<button class="btn btn-sm" data-act="report-download">下载 .md</button>' : '') +

      '<span>本周无变更 <b>' + r.skipped + '</b> 个</span>' +

/* ==================================================================
   七、详情抽屉（录入 + 流水）
   ================================================================== */
function openDrawer(id) {
  ui.openId = id;
  var root = document.getElementById('modalRoot');
  if (!root.querySelector('.mask')) {
    root.innerHTML = '<div class="mask" data-act="close-drawer"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>';
  }
  renderDrawer();
  /* 键盘用户打开抽屉后焦点要进来，不能留在背后的卡片上 */
  var dc = document.querySelector('.d-close');
  if (dc) { try { dc.focus({ preventScroll: true }); } catch (e) { dc.focus(); } }
}
function closeDrawer() {
  var backId = ui.openId;
  ui.openId = null;
  document.getElementById('modalRoot').innerHTML = '';
  /* 抽屉盖着的时候数据可能变过，周报 / 流水要跟着重算 */
  if (currentPage() !== 'overview') render();
  /* 焦点还给刚才那张卡片 */
  var card = backId ? document.querySelector('.card[data-id="' + backId + '"]') : null;
  if (card) { try { card.focus({ preventScroll: true }); } catch (e) {} }
}
function renderDrawer() {
  var p = find(ui.openId);
  var el = document.getElementById('drawer');
  if (!p) {
    /* 项目没了（清空 / 载入示例数据 / 导入整库）：抽屉要跟着收掉，
       否则屏幕上留着一个旧面板，点里面的按钮全都没反应 */
    if (ui.openId) {
      ui.openId = null;
      var root0 = document.getElementById('modalRoot');
      if (root0) root0.innerHTML = '';
    }
    return;
  }
  if (!el) return;
  var scroll = el.querySelector('.drawer-scroll');
  var top = scroll ? scroll.scrollTop : 0;
  el.innerHTML = drawerInner(p);
  var ns = el.querySelector('.drawer-scroll');
  if (ns) ns.scrollTop = top;
  var r = document.getElementById('prange');
  if (r) r.style.setProperty('--fill', r.value + '%');
}

function drawerInner(p) {
  var due = dueInfo(p);
  var h = healthOf(p);
  var blkActive = activeBlockers(p);
  var blkDone = (p.blockers || []).filter(function (b) { return b.resolvedAt; });
  var events = (p.events || []).slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });

  return '<div class="d-head">' +
    '<div class="d-top">' +
      '<h2>' + esc(p.name) + '</h2>' +
      '<div class="d-acts">' +
        '<button class="btn btn-sm" data-act="edit" data-id="' + p.id + '" aria-label="编辑 ' + esc(p.name) + '" title="改名称、阶段、进度、到期日、外链">编辑</button>' +
        '<button class="btn btn-sm d-del" data-act="del" data-id="' + p.id + '" aria-label="删除 ' + esc(p.name) + '" title="连里程碑、阻塞和流水一起删掉">删除</button>' +
      '</div>' +
      '<button class="d-close" data-act="close-drawer" title="关闭（Esc）">×</button>' +
    '</div>' +
    '<div class="d-meta">' +
      '<span class="hchip" data-h="' + h.level + '" title="' + esc(h.reason) + '"><span class="dot"></span>' + h.label + ' · ' + esc(String(h.reason || '').split(/[，,]/)[0]) + '</span>' +
      '<select class="sel" data-act="set-stage" data-id="' + p.id + '">' +
        STAGES.map(function (s) { return '<option' + (p.stage === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
      '</select>' +
      '<span class="sep"></span>' +
      '<span class="due" data-state="' + due.state + '">' + (p.due ? md(p.due) + ' · ' : '') + due.label + '</span>' +
      (p.link && /^(https?:|mailto:)/i.test(p.link) ? '<span class="sep"></span><a class="linkbtn" href="' + esc(p.link) + '" target="_blank" rel="noopener noreferrer">打开外链 ↗</a>' : '') +
      '<span class="sep"></span>' +
      '<button class="btn btn-sm btn-ghost" data-act="pin" data-id="' + p.id + '" title="钉在最前面，视线不用每天重新找">' + (p.pinned ? '取消置顶' : '置顶') + '</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="shelve" data-id="' + p.id + '">' + (p.shelved ? '取消搁置' : '搁置') + '</button>' +
      '<button class="btn btn-sm btn-ghost" data-act="exp-one" data-id="' + p.id + '" title="只导出这一个项目，可发给别人或单独备份">导出</button>' +
    '</div>' +
    (p.shelved && p.progress < 100 ? '<div class="shelvenote"><b>搁置中</b>' +
      (p.shelvedAt ? ' · 自 ' + md(p.shelvedAt) : '') +
      ' · ' + (p.shelveReason ? '原因：' + esc(p.shelveReason) : '还没写为什么停') +
      '<button class="linkbtn" data-act="shelve-reason" data-id="' + p.id + '">改原因</button></div>' : '') +
  '</div>' +

  '<div class="drawer-scroll">' +

    '<div class="panel">' +
      '<div class="slider-head"><b id="pctNow">' + p.progress + '<small>%</small></b>' +
        '<span>拖动松手即记流水</span></div>' +
      '<input type="range" id="prange" min="0" max="100" step="1" value="' + p.progress + '" ' +
        'data-act="progress-drag" data-id="' + p.id + '" style="--fill:' + p.progress + '%">' +
      '<div class="slider-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>' +
      '<div class="slider-hint">' + (p.desc ? esc(p.desc) : '还没有写简介。') + '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><h3>下一个动作</h3><span class="hint">卡片上显示这一行</span></div>' +
      '<div class="addrow" style="border-top:0;padding-top:0;margin-top:0">' +
        '<input class="flex1" id="nextInput" value="' + esc(p.next || '') + '" maxlength="120" ' +
          'placeholder="下一步做什么，一句话" data-id="' + p.id + '">' +
        '<button data-act="next-save" data-id="' + p.id + '">保存</button>' +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><h3>里程碑 <em>' + doneMilestones(p).length + '/' + (p.milestones || []).length + '</em></h3>' +
        '<span class="hint">勾选即记录</span></div>' +
      ((p.milestones || []).length ? (p.milestones || []).slice()
        .sort(function (a, b) { var ax = a.date || '9999', by = b.date || '9999'; return ax < by ? -1 : ax > by ? 1 : 0; })
        .map(function (m) {
          var left = (!m.done && m.date) ? dayDiff(m.date) : 0;
          var late = left < 0;
          var side = m.date ? (late ? md(m.date) + ' · 逾期 ' + (-left) + ' 天' : md(m.date)) : '未排期';
          return '<div class="item">' +
            '<span class="check"><input type="checkbox" data-act="ms-toggle" data-id="' + p.id + '" data-mid="' + m.id + '"' + (m.done ? ' checked' : '') + '></span>' +
            '<span class="item-text" data-done="' + (m.done ? 1 : 0) + '" data-act="ms-toggle" data-id="' + p.id + '" data-mid="' + m.id + '">' + esc(m.title) + '</span>' +
            '<span class="item-side"><time class="' + (late ? 'late' : '') + '">' + side + '</time>' +
            '<button class="kill" data-act="ms-del" data-id="' + p.id + '" data-mid="' + m.id + '" title="删除">×</button></span>' +
            '</div>';
        }).join('') : '<div class="inner-empty">还没有里程碑。</div>') +
      '<div class="addrow">' +
        '<textarea class="flex1" rows="1" placeholder="里程碑名称，回车添加；可粘贴多行" title="一行一个；行尾写 @11.24 或 @2026-12-05 给这条指定日期" data-add="ms" data-id="' + p.id + '"></textarea>' +
        '<input type="date" data-ms-date="' + p.id + '" title="没写 @日期的行用这个日期">' +
        '<button data-act="ms-add" data-id="' + p.id + '">添加</button>' +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><h3>阻塞项 <em>' + blkActive.length + ' 未解决</em></h3>' +
        '<span class="hint" data-red="' + (blkActive.length ? 1 : 0) + '">' + (blkActive.length ? '卡在这些事上' : '没有阻塞') + '</span></div>' +
      (blkActive.length ? blkActive.map(function (b) {
        var days = b.start ? (-dayDiff(b.start)) : 0;
        return '<div class="blk"><span class="bico">!</span><div style="flex:1;min-width:0">' +
          '<p>' + esc(b.text) + '</p>' +
          '<div class="bmeta"><span>开始 ' + (b.start ? md(b.start) : '—') + '</span>' +
          (days > 0 ? '<span class="bdays">已阻塞 ' + days + ' 天</span>' : '') +
          '<button class="linkbtn" data-act="blk-resolve" data-id="' + p.id + '" data-bid="' + b.id + '" style="margin-left:auto;font-size:11.5px">标记解决</button>' +
          '</div></div></div>';
      }).join('') : '') +
      (blkDone.length ? '<div style="margin-top:10px">' +
        '<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:6px">已解决（保留记录，不删除）</div>' +
        blkDone.map(function (b) {
          return '<div class="blk blk-resolved"><span class="bico">✓</span><div style="flex:1;min-width:0">' +
            '<p>' + esc(b.text) + '</p>' +
            '<div class="bmeta"><span>开始 ' + md(b.start) + ' · 解决 ' + md(b.resolvedAt) + '</span>' +
            '<button class="linkbtn" data-act="blk-reopen" data-id="' + p.id + '" data-bid="' + b.id + '" style="margin-left:auto;color:var(--ink-3);font-size:11.5px">重新打开</button>' +
            '</div></div></div>';
        }).join('') + '</div>' : '') +
      '<div class="addrow">' +
        '<input class="flex1" placeholder="新阻塞：卡在哪件事上" data-add="blk" data-id="' + p.id + '">' +
        '<input type="date" data-blk-start="' + p.id + '" value="' + todayISO() + '" title="开始日期（必填）">' +
        '<button data-act="blk-add" data-id="' + p.id + '">添加</button>' +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><h3>进度流水 <em>' + events.length + '</em></h3>' +
        '<span class="hint">' + (events.length > EV_SHOW ? '只显示最近 ' + EV_SHOW + ' 条 · 倒序' : '倒序') + '</span></div>' +
      (events.length ? '<div class="tl">' + events.slice(0, EV_SHOW).map(function (e) {
        return '<div class="tl-row"><span class="tl-dot" data-t="' + esc(e.type) + '"></span>' +
          '<div class="tl-body"><p data-strong="' + (e.type === 'progress' ? 1 : 0) + '">' + esc(e.text) + '</p>' +
          '<time>' + stampShort(e.at) + '</time></div></div>';
      }).join('') + '</div>' +
        (events.length > EV_SHOW ? '<div class="tl-more"><button class="linkbtn" data-act="open-stream">还有 ' + (events.length - EV_SHOW) + ' 条更早的 · 去流水页看</button></div>' : '')
      : '<div class="inner-empty">还没有记录。</div>') +
    '</div>' +

    '<div class="panel">' +
      '<div class="panel-head"><h3>想法 <em>' + (p.ideas || []).length + '</em></h3><span class="hint">先记下来，再决定做不做</span></div>' +
      ((p.ideas || []).length ? (p.ideas || []).slice()
        .sort(function (a, b) { return (b.at || '') < (a.at || '') ? -1 : 1; })
        .map(function (i) {
          return '<div class="idea"><p>' + esc(i.text) + '</p><div class="idea-foot">' +
            '<span class="tag" data-t="' + esc(i.tag) + '">' + esc(i.tag) + '</span><time>' + md(i.at) + '</time>' +
            '<span style="margin-left:auto"></span>' +
            '<button class="linkbtn" data-act="idea-tag" data-id="' + p.id + '" data-iid="' + i.id + '" style="font-size:11px">切换状态</button>' +
            '<button class="linkbtn" data-act="idea-del" data-id="' + p.id + '" data-iid="' + i.id + '" style="font-size:11px;color:var(--ink-3)">删除</button>' +
            '</div></div>';
        }).join('') : '<div class="inner-empty">还没有想法。</div>') +
      '<div class="addrow">' +
        '<input class="flex1" placeholder="记一条想法，回车保存" data-add="idea" data-id="' + p.id + '">' +
        '<select data-idea-tag="' + p.id + '">' + IDEA_TAGS.map(function (t) { return '<option>' + t + '</option>'; }).join('') + '</select>' +
      '</div>' +
    '</div>' +

  '</div>';
}

/* ==================================================================
   八、渲染与路由
   ================================================================== */
function currentPage() {
  if (/^#\/report/.test(location.hash)) return 'report';
  if (/^#\/stream/.test(location.hash)) return 'stream';
  return 'overview';
}
function render() {
  var y = window.scrollY;
  var page = currentPage();
  document.getElementById('app').innerHTML =
    page === 'report' ? viewReport() : page === 'stream' ? viewStream() : viewOverview();
  var nav = document.getElementById('nav');
  Array.prototype.forEach.call(nav.querySelectorAll('a'), function (a) {
    a.dataset.on = a.dataset.page === page ? 1 : 0;
  });
  /* 纸上那一行页眉只在总览出现（周报自己带标题，别重复） */
  var ph = document.getElementById('printHead');
  if (ph) {
    if (page === 'overview') {
      var s0 = summary();
      var shown = document.querySelectorAll('#app .wall .card').length;
